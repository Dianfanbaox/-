<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<title>钱有数 · Personal Wealth OS</title>
<link rel="icon" type="image/png" href="assets/app-icon-v3.png">
<link rel="apple-touch-icon" href="assets/app-icon-v3.png">
<style>
/* ================= 设计系统（双主题：浅色默认 / 深色，对齐 UI 设计稿） ================= */
:root{
  color-scheme:light;
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F4F4F8; --field:#FFFFFF;
  --line:rgba(17,17,19,.10); --line-s:rgba(17,17,19,.16);
  --text:#111113; --text2:rgba(17,17,19,.62); --text3:rgba(17,17,19,.45); --text4:rgba(17,17,19,.30);
  --green:#00C26B; --green-d:#009A55; --green-l:#009A55; --green-text:#009A55;
  --green-bg:rgba(0,194,107,.12);
  --amber:#FF9F0A; --amber-text:#8A6100; --amber-bg:rgba(255,159,10,.13); --amber-line:rgba(255,159,10,.40);
  --red:#FF453A; --red-bg:rgba(255,69,58,.10); --red-line:rgba(255,69,58,.32);
  --blue:#0A84FF; --blue-text:#0A84FF; --blue-bg:rgba(10,132,255,.10);
  --purple:#AF52DE; --gold:#FFD60A; --cash:#34C759;
  --gold-text:#9A7400; --gold-bg:rgba(245,180,0,.18); --gold-bar:#F2B400;
  --neg:#16161A;
  --track:rgba(17,17,19,.10); --axis:rgba(17,17,19,.42);
  --shell:#DCDCE2; --shell-border:rgba(17,17,19,.12); --shell-shadow:0 24px 80px rgba(17,17,19,.22);
  --bar-bg:rgba(255,255,255,.78); --bar-line:rgba(17,17,19,.08);
  --glass-bg:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.85);
  --ai-bg:linear-gradient(135deg,rgba(240,250,245,.72),rgba(233,243,251,.70)); --ai-line:rgba(0,194,107,.22);
  --item-line:rgba(17,17,19,.06); --tag-bg:rgba(17,17,19,.05);
  --toast-bg:rgba(255,255,255,.95); --toast-text:#111113;
  --grab:rgba(17,17,19,.16); --scrim:rgba(0,0,0,.4);
  --seg-bg:rgba(17,17,19,.06); --seg-shadow:0 1px 3px rgba(17,17,19,.12);
  --card-shadow:0 1px 2px rgba(17,17,19,.05);
  --shadow:0 8px 30px rgba(17,17,19,.12);
  --radius:18px; --radius-s:12px;
  --font:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0D10; --card:#1B1B1F; --card2:#232329; --field:#232329;
  --line:#2A2A30; --line-s:#3A3A42;
  --text:#F5F5F7; --text2:#C9C9D1; --text3:#9A9AA2; --text4:#6E6E76;
  --green:#00C26B; --green-d:#009A55; --green-l:#00D67B; --green-text:#00D67B;
  --green-bg:rgba(0,214,123,.14);
  --amber:#FF9F0A; --amber-text:#FFC24B; --amber-bg:rgba(255,159,10,.14); --amber-line:rgba(255,159,10,.40);
  --red:#FF453A; --red-bg:rgba(255,69,58,.14); --red-line:rgba(255,69,58,.3);
  --blue:#0A84FF; --blue-text:#64B5FF; --blue-bg:rgba(10,132,255,.14);
  --gold-text:#FFD60A; --gold-bg:rgba(255,214,10,.15); --gold-bar:#FFD60A;
  --neg:#8E8E96;
  --track:#2A2A30; --axis:#9A9AA2;
  --shell:#050507; --shell-border:#26262C; --shell-shadow:0 20px 80px rgba(0,0,0,.6);
  --bar-bg:rgba(20,20,24,.72); --bar-line:rgba(255,255,255,.08);
  --glass-bg:rgba(28,28,34,.6); --glass-line:rgba(255,255,255,.09);
  --ai-bg:linear-gradient(135deg,rgba(0,194,107,.12),rgba(10,132,255,.10)); --ai-line:rgba(0,214,123,.25);
  --item-line:rgba(255,255,255,.05); --tag-bg:rgba(255,255,255,.07);
  --toast-bg:rgba(35,35,41,.95); --toast-text:#F5F5F7;
  --grab:#3A3A42; --scrim:rgba(0,0,0,.5);
  --seg-bg:rgba(255,255,255,.08); --seg-shadow:none;
  --card-shadow:none;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45;
}
/* 手机壳：桌面居中 390×844（小米14 比例），移动端全屏 */
#phone{
  position:relative; width:390px; height:844px; background:var(--bg);
  border-radius:44px; overflow:hidden; box-shadow:var(--shell-shadow);
  border:1px solid var(--shell-border); display:flex; flex-direction:column;
}
@media (max-width:430px){
  body{display:block;}
  #phone{width:100vw;height:100dvh;border-radius:0;border:none;}
  #statusbar{display:none !important;}
  #app{padding-top:env(safe-area-inset-top);}
}
/* 状态栏 */
#statusbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:var(--text);z-index:50;position:relative;}
#statusbar .time{letter-spacing:.5px;}
/* 主内容区 */
#app{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative;-webkit-overflow-scrolling:touch;}
#app::-webkit-scrollbar{display:none;}
.view{display:none;padding:0 20px 96px;animation:viewIn .28s cubic-bezier(.2,.8,.2,1);}
.view.active{display:block;}
@keyframes viewIn{from{transform:translateY(8px);}to{transform:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
/* 底栏：毛玻璃悬浮 */
#tabbar{
  position:absolute; left:10px; right:10px; bottom:8px; height:62px; z-index:60;
  display:flex; border-radius:22px;
  background:var(--bar-bg); backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--bar-line); box-shadow:var(--shadow);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text4);cursor:pointer;transition:color .2s;border:none;background:none;font-family:var(--font);}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:10.5px;font-weight:600;}
.tab.active{color:var(--green-text);}
.tab:active{transform:scale(.94);}
/* ===== 通用组件 ===== */
h1.page{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:18px 0 6px;}
.sub{color:var(--text3);font-size:12.5px;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow);}
.card h3{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;letter-spacing:.02em;}
.card.glass{background:var(--ai-bg);border:1px solid var(--ai-line);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--card-shadow);}
.big{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.num-pos{color:var(--green-text);}
.num-neg{color:var(--text2);}
.num-amber{color:var(--amber-text);}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:14px;border-radius:16px;border:1px solid transparent;cursor:pointer;
  font-family:var(--font);font-size:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);
  box-shadow:0 6px 18px rgba(0,154,85,.24);
  transition:transform .12s ease,opacity .2s;
}
.btn:active{transform:scale(.96);}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line);}
.btn.danger{background:var(--red-bg);color:var(--red);box-shadow:none;border:1px solid var(--red-line);}
.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:12px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.row + .btn{margin-top:0;}
.btn + .btn{margin-top:10px;}
.row > .btn, div[style*="display:flex"] > .btn{margin-top:0 !important;}
/* 拖拽排序把手 */
.grip{flex:none;width:22px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;color:var(--text4);touch-action:none;}
.grip:active{cursor:grabbing;}
.grip i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55;}
.item.dragging{opacity:.45;}
.item.drag-over{box-shadow:0 -2px 0 var(--green);}
.glass{
  background:var(--glass-bg); backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-line);
}
/* 主题分段控件 */
.seg3{display:flex;gap:2px;background:var(--seg-bg);border-radius:13px;padding:4px;}
.seg3 button{flex:1;border:none;background:none;padding:9px 0;border-radius:10px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;color:var(--text3);transition:all .18s;}
.seg3 button.on{background:var(--card);color:var(--text);box-shadow:var(--seg-shadow);}
/* 输入 */
input,textarea,select{
  width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line-s);
  background:var(--field);color:var(--text);font-family:var(--font);font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg);}
input.num,textarea.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
label.f{display:block;font-size:12.5px;color:var(--text2);font-weight:600;margin:12px 0 6px;}
/* 快速输入条 */
.quick{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;}
.quick input,.quick textarea{flex:1;min-width:0;}
.quick textarea{resize:none;line-height:1.5;padding-top:12px;padding-bottom:12px;}
.spin-dot{display:inline-block;width:11px;height:11px;border:1.5px solid var(--text4);border-top-color:var(--green);border-radius:50%;animation:aiSpin .8s linear infinite;vertical-align:middle;margin-right:5px;}
@keyframes aiSpin{to{transform:rotate(360deg);}}
/* 列表行 */
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--item-line);}
.item:last-child{border-bottom:none;}
.item .nm{flex:1;min-width:0;}
.item .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .nm small{color:var(--text4);font-size:11.5px;}
.item .amt{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--tag-bg);color:var(--text3);font-weight:600;flex:none;}
.tag.green{background:var(--green-bg);color:var(--green-text);}
.tag.amber{background:var(--amber-bg);color:var(--amber-text);}
.tag.red{background:var(--red-bg);color:var(--red);}
.tag.blue{background:var(--blue-bg);color:var(--blue-text);}
.icon-btn{border:none;background:none;color:var(--text3);cursor:pointer;padding:6px;border-radius:10px;display:flex;}
.icon-btn:active{transform:scale(.9);}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.why-btn{border:none;background:var(--bg2);color:var(--text3);cursor:pointer;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;}
.why-btn:active{transform:scale(.95);}
.why-tray{position:relative;background:var(--card2);border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);}
.why-tray::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);}
.why-tray-head{width:100%;border:none;background:transparent;color:var(--text3);cursor:pointer;padding:11px 16px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;}
.why-tray-head:active{opacity:.7;}
.why-tray-head svg{transition:transform .25s ease;}
.why-tray.open .why-tray-head svg{transform:rotate(180deg);}
.why-tray-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.why-tray.open .why-tray-body{max-height:400px;}
.why-tray-body-inner{padding:2px 16px 14px;}
.empty{text-align:center;color:var(--text4);padding:36px 0;font-size:13px;}
/* 弹层 */
#sheet{
  position:absolute;inset:0;z-index:90;display:none;flex-direction:column;justify-content:flex-end;
}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);}
#sheet .body{
  position:relative;background:var(--card);border-radius:26px 26px 0 0;padding:20px 20px 28px;
  border-top:1px solid var(--line);max-height:82%;overflow-y:auto;
  animation:sheetUp .32s cubic-bezier(.2,.9,.25,1.1);
}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.5;}to{transform:none;opacity:1;}}
#sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--grab);margin:0 auto 16px;}
/* 图表 */
.chart-title{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;}
.chart-title b{color:var(--text);font-family:var(--mono);}
/* toast */
#toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);backdrop-filter:blur(16px);color:var(--toast-text);padding:10px 18px;border-radius:14px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:all .25s;border:1px solid var(--line);white-space:nowrap;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* 状态动效图标 */
.anim-ico{width:56px;height:56px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--green);}
.anim-ico svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.breath{animation:breath 1.4s ease-in-out infinite;}
@keyframes breath{0%,100%{opacity:.35;transform:scale(.92);}50%{opacity:1;transform:scale(1);}}
.pulse2{animation:pulse2 1.2s ease-in-out infinite;}
@keyframes pulse2{0%,100%{opacity:.5;}50%{opacity:1;}}
.stagger>*{animation:itemIn .4s cubic-bezier(.2,.8,.2,1) backwards;}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.13s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.23s}.stagger>*:nth-child(6){animation-delay:.28s}
@keyframes itemIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .view{animation:none;}
  .stagger>*{animation:none;}
  .breath,.pulse2{animation:none;}
  #sheet .body{animation:none;}
}
/* 待结算提示条 */
.notice{display:flex;align-items:center;gap:8px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--amber-text);font-weight:500;}
.notice svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;}
/* 步骤条 */
.steps{display:flex;gap:6px;margin:12px 0 16px;}
.steps .st{flex:1;height:4px;border-radius:4px;background:var(--track);}
.steps .st.done{background:var(--green);}
.steps .st.cur{background:var(--green-text);}
/* 汇总小条 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--card-shadow);}
.stat .k{font-size:11px;color:var(--text4);font-weight:600;}
.stat .v{font-family:var(--mono);font-weight:700;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;}
</style>

    <button class="tab" data-view="home" onclick="App.go('home')">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-view="settle" onclick="App.go('settle')">

      <span>结算</span>
    </button>
    <button class="tab" data-view="history" onclick="App.go('history')">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/><path d="M3 12H1m2-6 3 3M21 12h-2m-3-9 3 3"/></svg>
      <span>历史</span>

    <button class="tab" data-view="settings" onclick="App.go('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      <span>设置</span>

  </div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="askMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;"></div>
  <div id="askPanel" style="display:none;position:fixed;left:0;right:0;bottom:0;height:72vh;background:var(--bg);border-radius:22px 22px 0 0;z-index:301;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.18);">
    <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex:none;">
      <b style="font-size:15px;">问钱有数</b>
      <button onclick="App.closeAskPanel()" style="background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer;padding:4px 8px;">✕</button>
    </div>
    <div id="askMsgs" style="flex:1;overflow-y:auto;padding:14px 16px;"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none;">
      <input id="askInput" placeholder="问问你的钱…" style="flex:1;min-width:0;" onkeydown="if(event.key==='Enter')App.sendAsk()">
      <button class="btn sm" onclick="App.sendAsk()">发送</button>
    </div>
  </div>
</div>
<script>
/* ===== engine.js 内联 ===== */
/* ============================================================
 * Personal Wealth OS 1.0 — Calculation Engine
 * 唯一财务计算来源。UI 不得散落财务公式。
 * 金额一律以「分」(整数) 存储与计算，避免浮点误差。
 * 规则依据：03_财务计算引擎.md（最高优先级）
 * ============================================================ */
(function (global) {
  'use strict';

  // ---------- 工具 ----------
  const M = 100; // 1 元 = 100 分
  function roundCents(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function fmtCents(c) {
    const sign = c < 0 ? '-' : '';
    const a = Math.abs(Math.round(c));
    const y = Math.floor(a / 100), f = a % 100;
    return sign + '¥' + y.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + String(f).padStart(2, '0') : '');
  }
  function fmtNum(n, dec) { return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
  function sum(arr) { return arr.reduce((a, b) => a + (b || 0), 0); }

  // ---------- 月份工具 ----------
  function addMonth(ym, delta) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthList(startYm, endYm) {
    const out = []; let cur = startYm;
    while (cur <= endYm) { out.push(cur); cur = addMonth(cur, 1); }
    return out;
  }

  // ---------- 月度计算 ----------
  /**
   * facts: {
   *   month,
   *   income:      [{ amount, toSavings }]
   *   expense:     [{ amount }]
   *   investments: [{ type:'buy'|'sell'|'userIncome', tx, principal, realized, source }]
   *   loans:       [{ type:'lend'|'repay'|'writeoff', cashDelta, loanDelta, writeoffToSavings }]
   *   prevSnapshots: { assetId: cnyCents }     // 上月月末值（人民币）
   *   snapshots:    { assetId: { originalCents, fxRate, cnyCents, isNew, isArchived } }  // 本月确认值
   *   fxChanges:    { assetId: cnyDelta }      // 汇率因素导致的 cny 变化（外币）
   * }
   * 返回本月快照与校验信息。
   */
  function calcMonth(facts) {
    const income = facts.income || [];
    const expense = facts.expense || [];
    const inv = facts.investments || [];
    const loans = facts.loans || [];
    const prev = facts.prevSnapshots || {};
    const snaps = facts.snapshots || {};
    const fx = facts.fxChanges || {};

    // 1) 本月存钱
    const incomeToSavings = sum(income.filter(i => i.toSavings !== false).map(i => i.amount));
    const expenseTotal = sum(expense.map(e => e.amount));
    const realizedPnl = sum(inv.filter(i => i.type === 'sell').map(i => i.realized))
      + sum(inv.filter(i => i.type === 'userIncome').map(i => i.realized !== undefined ? i.realized : i.tx));
    const writeoffPnl = sum(loans.filter(l => l.type === 'writeoff' && l.writeoffToSavings).map(l => -l.loanDelta));
    const savings = roundCents(incomeToSavings - expenseTotal + realizedPnl + writeoffPnl);

    // 2) 本月总资产
    let totalAssets = 0;
    const assetValues = {};
    Object.keys(snaps).forEach(id => {
      const s = snaps[id];
      const v = s.cnyCents !== undefined ? s.cnyCents : Math.round(s.originalCents * (s.fxRate || 1));
      assetValues[id] = v;
      totalAssets += v;
    });
    totalAssets = roundCents(totalAssets);

    // 3) 总资产变化与原因分解
    const prevTotal = sum(Object.keys(prev).map(k => prev[k]));
    const assetChange = roundCents(totalAssets - prevTotal);
    const reasons = [];
    reasons.push({ key: 'savings', label: '存钱净流入（收入/支出/盈亏）', amount: roundCents(savings) });
    const fxTotal = sum(Object.keys(fx).map(k => fx[k]));
    if (Math.abs(fxTotal) > 0.5) reasons.push({ key: 'fx', label: '外币汇率变化', amount: roundCents(fxTotal) });
    // 非存钱资产变动（如 toSavings=false 的收入、买入卖出本金结构调整的净 0 之外的部分）
    const incomeNotToSavings = sum(income.filter(i => i.toSavings === false).map(i => i.amount));
    if (Math.abs(incomeNotToSavings) > 0.5) reasons.push({ key: 'incomeNonSavings', label: '不计入存钱的收入', amount: roundCents(incomeNotToSavings) });
    const other = roundCents(assetChange - savings - fxTotal - incomeNotToSavings);
    if (Math.abs(other) > 0.5) reasons.push({ key: 'other', label: '资产调整/新增归档（待核实）', amount: other });

    // 4) 资产校验
    // 理论月末资产 = 上月总资产 + 存钱 + 汇率变化 + 不计存钱收入 + 新增资产 - 归档资产
    let added = 0, archived = 0;
    Object.keys(snaps).forEach(id => {
      if (snaps[id].isNew) added += assetValues[id];
      if (snaps[id].isArchived) archived += prev[id] || 0;
    });
    const theoreticalAssets = roundCents(prevTotal + savings + fxTotal + incomeNotToSavings + added - archived);
    // 第一个月（没有上月基准）不做账不平校验
    const anomalyDiff = prevTotal === 0 ? 0 : roundCents(totalAssets - theoreticalAssets);
    const anomalyCauses = Math.abs(anomalyDiff) < 0.5 ? [] : buildCauses(anomalyDiff, facts);

    return {
      month: facts.month,
      incomeTotal: roundCents(sum(income.map(i => i.amount))),
      expenseTotal,
      savings,
      totalAssets,
      assetChange,
      assetChangeReasons: reasons,
      assetValues,
      theoreticalAssets,
      anomalyDiff,
      anomalyCauses,
    };
  }

  function buildCauses(diff, facts) {
    if (Math.abs(diff) < 0.5) return [];
    const causes = [];
    causes.push({ label: '可能有漏记的收入或支出', evidence: '校验差额 ' + fmtCents(diff) });
    causes.push({ label: '新增资产未记录 / 资产减少未记录', evidence: '核对本月资产快照与上月差异' });
    causes.push({ label: '投资卖出对应本金填写可能有误', evidence: '已实现盈亏只按本金计算' });
    causes.push({ label: '借出款 / 外币金额或汇率可能有误', evidence: '外币按冻结汇率折算' });
    causes.push({ label: '其他自定义事项', evidence: '可添加说明，AI 只提示可能性' });
    return causes;
  }

  // ---------- 年度重算 ----------
  /**
   * factsByMonth: { 'YYYY-MM': facts }
   * opts: { year, yearlyGoalCents, forecastOverrides }
   * 从最早月份顺序重算；返回 { results, yearly }
   */
  function recalcAll(factsByMonth, opts) {
    const months = Object.keys(factsByMonth).sort();
    const results = {};
    let prevSnap = {};
    months.forEach(m => {
      const f = factsByMonth[m];
      f.prevSnapshots = prevSnap;
      const r = calcMonth(f);
      results[m] = r;
      prevSnap = r.assetValues;
    });
    // 年度累计 / 目标 / 预测
    const year = opts.year;
    const ymPrefix = year + '-';
    const yearMonths = months.filter(m => m.startsWith(ymPrefix));
    const yearlyCumulative = roundCents(sum(yearMonths.map(m => results[m].savings)));
    const yearlyGoal = opts.yearlyGoalCents || 0;
    const progress = yearlyGoal > 0 ? Math.round(yearlyCumulative / yearlyGoal * 10000) / 100 : 0;
    const remaining = roundCents(yearlyGoal - yearlyCumulative);

    // 预测：已发生实际 + 未来月份（收入按历史平均预测，支出默认 0）
    const pastSavings = sum(yearMonths.map(m => results[m].savings));
    const futureMonths = opts.futureMonths || [];
    let forecastSavings = pastSavings;
    const histIncomes = yearMonths.map(m => results[m].incomeTotal).filter(v => v > 0);
    const avgIncome = histIncomes.length ? sum(histIncomes) / histIncomes.length : 0;
    futureMonths.forEach(m => {
      const ov = opts.forecastOverrides && opts.forecastOverrides[m];
      const estIncome = ov !== undefined ? ov : avgIncome;
      forecastSavings += estIncome; // 未来支出不预测，默认 0
    });
    forecastSavings = roundCents(forecastSavings);
    const forecastGap = roundCents(yearlyGoal - forecastSavings);

    // 月度目标：历史锁定由调用方传入 lockedTargets
    return {
      results,
      yearly: {
        year, yearlyCumulative, yearlyGoal, progress, remaining,
        yearEndForecast: forecastSavings, forecastGap,
        avgMonthlyIncome: avgIncome,
      },
      prevSnap,
    };
  }

  // ---------- 导出 ----------
  global.PWEngine = {
    M, roundCents, fmtCents, fmtNum, sum, addMonth, monthList,
    calcMonth, recalcAll,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== db.js 内联 ===== */
/* ============================================================
 * Personal Wealth OS 1.0 — 本地数据层 (IndexedDB)
 * 本地优先：所有读写先落本地库；写操作进 sync_queue 供云端同步。
 * 依据：04_数据模型与技术架构.md / 09_云端基础设施与部署文档.md
 * ============================================================ */
(function (global) {
  'use strict';

  const DB_NAME = new URLSearchParams(location.search).get('preview') === '1' ? 'pwos-ui-v3-preview' : 'pwos-ui-v3';
  const DB_VERSION = 5;
  const SCHEMA_VERSION = 1;
  const CALC_VERSION = 1;

  const STORES = [
    'assets', 'snapshots', 'income', 'expense', 'specialEvents',
    'investments', 'loans', 'goals', 'goalHistory', 'forecasts',
    'fxRates', 'recurring', 'calcSnapshots', 'syncQueue', 'meta',
  ];
  // 需要的索引：[store, key]
  const INDEXES = [
    ['income', 'month'], ['expense', 'month'],
    ['snapshots', 'month'], ['snapshots', 'assetId'],
    ['investments', 'month'], ['loans', 'month'],
    ['recurring', 'type'], ['calcSnapshots', 'month'],
    ['specialEvents', 'month'], ['syncQueue', 'status'],
  ];

  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        const tx = e.target.transaction; // 版本变更事务
        STORES.forEach(name => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'id' });
        });
        INDEXES.forEach(([s, k]) => {
          try {
            if (!db.objectStoreNames.contains(s)) return;
            const os = tx.objectStore(s);
            if (!os.indexNames.contains(k)) os.createIndex(k, k);
          } catch (err) { /* 索引失败不阻断 */ }
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function tx(store, mode, fn) {
    return openDB().then(db => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const os = t.objectStore(store);
      const out = fn(os);
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));
  }

  const genId = () => {
    if (global.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  };

  // ---------- 通用 CRUD ----------
  const DB = {
    open: openDB,

    put(store, obj) { return tx(store, 'readwrite', os => os.put(obj)); },
    bulkPut(store, arr) { return tx(store, 'readwrite', os => { arr.forEach(o => os.put(o)); return arr.length; }); },
    get(store, id) { return tx(store, 'readonly', os => new Promise((res, rej) => { const r = os.get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
    del(store, id) { return tx(store, 'readwrite', os => os.delete(id)); },
    all(store) { return tx(store, 'readonly', os => new Promise((res, rej) => { const r = os.getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); })); },
    byIndex(store, index, value) {
      return tx(store, 'readonly', os => new Promise((res, rej) => {
        const r = os.index(index).getAll(value);
        r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
      }));
    },
    clear(store) { return tx(store, 'readwrite', os => os.clear()); },

    // meta 键值
    async getMeta(key) { const v = await DB.get('meta', key); return v ? v.value : undefined; },
    async setMeta(key, value) { await DB.put('meta', { id: key, value }); },

    genId,
    SCHEMA_VERSION,
    CALC_VERSION,
  };

  // ---------- 同步队列 ----------
  const Sync = {
    async enqueue(entityType, entityId, operation, payload) {
      await DB.put('syncQueue', {
        id: genId(), entityType, entityId, operation,
        payload: payload || null, created_at: new Date().toISOString(),
        retry_count: 0, last_error: null, status: 'pending',
      });
    },
    async listPending() { return DB.byIndex('syncQueue', 'status', 'pending'); },
    async markSuccess(id) { await DB.del('syncQueue', id); },
    async markFailed(id, err) {
      const item = await DB.get('syncQueue', id);
      if (!item) return;
      item.retry_count = (item.retry_count || 0) + 1;
      item.last_error = String(err).slice(0, 500);
      item.status = item.retry_count >= 5 ? 'failed' : 'pending';
      await DB.put('syncQueue', item);
    },
  };

  // ---------- 数据导出 / 导入 ----------
  async function exportAll() {
    const data = {};
    for (const s of STORES) {
      if (s === 'syncQueue') continue;
      data[s] = await DB.all(s);
    }
    const meta = {
      app_version: '1.0.0',
      schema_version: SCHEMA_VERSION,
      calculation_version: CALC_VERSION,
      export_time: new Date().toISOString(),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      currency: 'CNY',
    };
    return { data, meta };
  }

  async function importAll(payload) {
    // 先清空业务表，再写入；meta 保留 app 信息
    for (const s of STORES) {
      if (s === 'meta' || s === 'syncQueue') continue;
      await DB.clear(s);
    }
    const data = payload.data || {};
    for (const s of Object.keys(data)) {
      if (STORES.indexOf(s) >= 0 && Array.isArray(data[s])) {
        await DB.bulkPut(s, data[s]);
      }
    }
    return true;
  }

  DB.Sync = Sync;
  DB.exportAll = exportAll;
  DB.importAll = importAll;

  global.PWDB = DB;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============================================================
 * Personal Wealth OS 1.0 — App 主逻辑
 * ============================================================ */
'use strict';
const E = window.PWEngine, DB = window.PWDB;

/* ---------- 基础工具 ---------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yuan = cents => (cents / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmtYuan = c => (c < 0 ? '-¥' : '¥') + yuan(Math.abs(c));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const nowMonth = () => today().slice(0, 7);
const curYear = () => Number(today().slice(0, 4));
const monthCn = ym => { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; };
const lastMonth = ym => E.addMonth(ym, -1);

const toast = (msg) => {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
};

/* ---------- 主题（浅色默认 / 深色 / 跟随系统） ---------- */
const cssVar = n => (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim();
const Theme = {
  mode: 'light',
  mq() { return window.matchMedia('(prefers-color-scheme: dark)'); },
  effective(mode) { const m = mode || this.mode; return m === 'system' ? (this.mq().matches ? 'dark' : 'light') : m; },
  apply(mode) {
    this.mode = mode || this.mode;
    document.documentElement.setAttribute('data-theme', this.effective(this.mode));
  },
  async init() {
    let saved = 'light';
    try { saved = (await DB.getMeta('theme')) || 'light'; } catch (e) {}
    this.apply(saved);
    const m = this.mq();
    const cb = () => { if (this.mode === 'system') { this.apply('system'); if (window.App) App.route(); } };
    if (m.addEventListener) m.addEventListener('change', cb); else if (m.addListener) m.addListener(cb);
  },
  set(mode) {
    this.apply(mode);
    $$('.seg3 button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    DB.setMeta('theme', mode).catch(() => {});
  },
  isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; },
};
/* 资产标签文字色：donut 色块用饱和原色，标签文字在浅色下用加深色保证可读 */
const ASSET_TAG_INK = { bank: '#009A55', cash: '#1C8C3F', investment: '#9A7400', wealth: '#0A6ED6', loan: '#8E44AD', fx: '#C76A00', other: '#6E6E76' };
function assetTagStyle(type, color) {
  const c = (window.QYSUI && QYSUI.assetColors()[type]) || color || '#888';
  if (Theme.isDark()) return `background:${c}22;color:${c};`;
  return `background:${c}1A;color:${ASSET_TAG_INK[type] || '#444'};`;
}

/* ---------- 全局状态 ---------- */
const App = {
  state: {
    initialized: false,
    year: curYear(),
    prefs: null,
    goal: null,
    user: null,
    view: 'launch',
    settle: { month: nowMonth(), step: 'income', confirmed: false },
    sessionVerified: false,
  },
  async boot() {
    await Theme.init();
    try {
      const init = await DB.getMeta('initialized');
      this.state.initialized = !!init;
      const prefs = await DB.getMeta('prefs');
      this.state.prefs = prefs;
      const goal = await DB.getMeta('goal');
      if (!goal) {
        const yearly = await Svc.getYearly(curYear());
        this.state.goal = (yearly && yearly.current_target) || 0;
      } else {
        this.state.goal = goal;
      }
      const user = await DB.getMeta('user');
      this.state.user = user;
      const ai = await DB.getMeta('aiConfig');
      this.state.ai = ai || null;
    } catch (e) { console.warn('boot', e); }
    this.route();
  },
  route() {
    const h = (location.hash || '#/launch').replace(/^#\//, '');
    const [view, qs] = h.split('?');
    const params = new URLSearchParams(qs || '');
    if (!this.state.initialized && view !== 'init') { this.show('init'); return; }
    this.show(view || 'home', params);
  },
  show(view, params) {
    this.state.view = view;
    const views = ['home', 'settle', 'history', 'assets', 'goal', 'settings', 'init', 'launch', 'login'];
    if (views.indexOf(view) < 0) view = 'home';
    if (view === 'launch') { this.renderLaunch(); return; }
    if (view === 'init') { this.renderInit(); return; }
    if (view === 'login') { this.renderLogin(); return; }
    // 主视图显示底栏
    $('#tabbar').style.display = 'flex';
    $$('#tabbar .tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    const fn = { home: () => this.renderHome(), settle: () => this.renderSettle(params), history: () => this.renderHistory(params), assets: () => this.renderAssets(), goal: () => this.renderGoal(), settings: () => this.renderSettings(params) }[view];
    fn();
  },
  go(view, params) {
    const target = '#/' + view + (params ? '?' + params : '');
    if (location.hash !== target) history.pushState(null, '', target);
    window.scrollTo && window.scrollTo(0, 0);
    this.route();
  },
  setView(view, html) {
    const app = $('#app');
    app.innerHTML = '<div class="view active" id="v-' + view + '">' + html + '</div>';
    app.scrollTop = 0;
  },
};

/* ---------- 数据服务 ---------- */
const Svc = {
  /* 资产 */
  async listAssets(includeArchived) {
    let arr = await DB.all('assets');
    arr = arr.filter(a => !a.archived || includeArchived).sort((a, b) => (a.order || 0) - (b.order || 0));
    return arr;
  },
  async saveAsset(asset) {
    if (!asset.id) asset.id = DB.genId();
    await DB.put('assets', asset);
    await DB.Sync.enqueue('assets', asset.id, 'upsert', asset);
    return asset;
  },
  async archiveAsset(id) {
    const a = await DB.get('assets', id);
    if (!a) return;
    a.archived = true; a.archived_at = new Date().toISOString();
    await DB.put('assets', a);
    await DB.Sync.enqueue('assets', id, 'upsert', a);
  },

  /* 某月资产快照（人民币口径） */
  async snapshotsOf(month) {
    const list = await DB.byIndex('snapshots', 'month', month);
    const map = {};
    list.forEach(s => { map[s.assetId] = s; });
    return map;
  },
  async saveSnapshots(month, entries) {
    // 先查已有快照，按 month+assetId 更新，避免重复记录
    const existing = await DB.byIndex('snapshots', 'month', month);
    const existingMap = {};
    existing.forEach(r => { existingMap[r.assetId] = r; });
    for (const e of entries) {
      const old = existingMap[e.assetId];
      const rec = {
        id: old ? old.id : (e.id || DB.genId()),
        assetId: e.assetId, month,
        original_cents: e.originalCents, currency: e.currency,
        fx_rate: e.fxRate || null, cny_cents: e.cnyCents,
        source: e.source || 'user', created_at: old ? old.created_at : new Date().toISOString(),
      };
      await DB.put('snapshots', rec);
      await DB.Sync.enqueue('snapshots', rec.id, 'upsert', rec);
    }
  },

  /* 收入 / 支出 */
  async listIncome(month) { return (await DB.byIndex('income', 'month', month)).filter(i => !i.deleted); },
  async listExpense(month) { return (await DB.byIndex('expense', 'month', month)).filter(i => !i.deleted); },
  async saveIncome(item) {
    if (!item.id) item.id = DB.genId();
    item.month = item.month || nowMonth();
    await DB.put('income', item);
    await DB.Sync.enqueue('income', item.id, 'upsert', item);
    return item;
  },
  async saveExpense(item) {
    if (!item.id) item.id = DB.genId();
    item.month = item.month || nowMonth();
    await DB.put('expense', item);
    await DB.Sync.enqueue('expense', item.id, 'upsert', item);
    return item;
  },
  async softDelete(store, id) {
    const rec = await DB.get(store, id);
    if (!rec) return;
    rec.deleted = true; rec.deleted_at = new Date().toISOString();
    await DB.put(store, rec);
    await DB.Sync.enqueue(store, id, 'delete', { id });
  },

  /* 投资 / 借出 */
  async listInvestments(month) { return (await DB.byIndex('investments', 'month', month)).filter(i => !i.deleted); },
  async listLoans(month) { return (await DB.byIndex('loans', 'month', month)).filter(i => !i.deleted); },
  async saveInvestment(ev) {
    if (!ev.id) ev.id = DB.genId();
    ev.month = ev.month || nowMonth();
    await DB.put('investments', ev);
    await DB.Sync.enqueue('investments', ev.id, 'upsert', ev);
    return ev;
  },
  async saveLoan(ev) {
    if (!ev.id) ev.id = DB.genId();
    ev.month = ev.month || nowMonth();
    await DB.put('loans', ev);
    await DB.Sync.enqueue('loans', ev.id, 'upsert', ev);
    return ev;
  },

  /* 特殊事项（解析后存为对应结构化事件 + 原始文本留痕） */
  async listSpecial(month) { return (await DB.byIndex('specialEvents', 'month', month)).filter(i => !i.deleted); },
  async saveSpecial(ev) {
    if (!ev.id) ev.id = DB.genId();
    await DB.put('specialEvents', ev);
    await DB.Sync.enqueue('specialEvents', ev.id, 'upsert', ev);
    return ev;
  },

  /* 重复项目 */
  async listRecurring() { return (await DB.all('recurring')).filter(r => !r.deleted); },
  async saveRecurring(r) {
    if (!r.id) r.id = DB.genId();
    await DB.put('recurring', r);
    return r;
  },
  async stopRecurring(id) {
    const r = await DB.get('recurring', id);
    if (!r) return;
    r.active = false; r.end_month = nowMonth();
    await DB.put('recurring', r);
  },

  /* 组装某月事实 → 引擎 */
  async factsOf(month, prevAssets) {
    const [income, expense, investments, loans] = await Promise.all([
      this.listIncome(month), this.listExpense(month),
      this.listInvestments(month), this.listLoans(month),
    ]);
    const snaps = await this.snapshotsOf(month);
    const assets = await this.listAssets(true);
    // snapshots → 引擎格式；判断新增/归档
    const snapshots = {}, fxChanges = {};
    const assetById = {}; assets.forEach(a => assetById[a.id] = a);
    for (const id of Object.keys(snaps)) {
      const s = snaps[id];
      snapshots[id] = {
        originalCents: s.original_cents,
        fxRate: s.fx_rate || null,
        cnyCents: s.cny_cents,
      };
      const prevVal = prevAssets && prevAssets[id];
      if (prevVal === undefined) snapshots[id].isNew = true;
    }
    // 归档：上月有、本月无 → isArchived（引擎扣减）
    if (prevAssets) {
      Object.keys(prevAssets).forEach(id => {
        if (!snaps[id]) {
          const a = assetById[id];
          if (a && a.archived) snapshots[id] = { cnyCents: prevAssets[id], isArchived: true };
        }
      });
    }
    // 汇率变化：外币资产原币不变但汇率变
    if (prevAssets) {
      Object.keys(snaps).forEach(id => {
        const s = snaps[id];
        if (s.fxRate && prevAssets[id] !== undefined && !s.isNew && !s.isArchived) {
          const prev = prevAssets[id];
          const cur = s.cnyCents !== undefined ? s.cnyCents : Math.round(s.originalCents * s.fxRate);
          fxChanges[id] = cur - prev; // 总变化（含原币变动）；引擎仅用于展示汇率项
        }
      });
    }
    return {
      month,
      income: income.map(i => ({ amount: i.amount, toSavings: i.to_savings !== false })),
      expense: expense.map(e => ({ amount: e.amount })),
      investments: investments.map(v => ({
        type: v.type,
        tx: v.tx_amount, principal: v.principal_amount,
        realized: v.realized_pnl, source: v.calc_source,
      })),
      loans: loans.map(l => ({
        type: l.type, cashDelta: l.cash_delta, loanDelta: l.loan_delta,
        writeoffToSavings: l.writeoff_to_savings,
      })),
      snapshots, fxChanges,
    };
  },

  /* 重算链：从最早受影响月向后顺序重算 */
  async recalc(fromMonth, opts) {
    const year = opts && opts.year !== undefined ? opts.year : App.state.year;
    let goal = opts && opts.goal !== undefined ? opts.goal : null;
    if (goal == null) {
      // B2：目标按结算月所属年份取，补录历史月不再误用当前年目标
      const gy = await this.getYearly(year);
      goal = (gy && gy.current_target) || 0;
    }
    const months = this.allMonthsSince(fromMonth);
    const existing = await DB.all('calcSnapshots');
    const settledSet = new Set(existing.map(s => s.month));
    let prev = null;
    for (const m of months) {
      const monthSnaps = await this.snapshotsOf(m);
      const hasData = Object.keys(monthSnaps).length > 0;
      // 空月跳过，prev 保持上一个有数据月的值
      if (!hasData) continue;
      const f = await this.factsOf(m, prev);
      if (prev === null) {
        // 首月：如果最早快照月就是当前月，说明是初始化月，用 assets 表的初始金额作为基准
        const allSnaps = await DB.all('snapshots');
        const snapMonths = [...new Set(allSnaps.map(x => x.month))].sort();
        const earliestMonth = snapMonths[0];
        let p = {};
        if (earliestMonth && earliestMonth < m) {
          // 有更早的历史快照月，用它
          const earliestSnaps = await this.snapshotsOf(earliestMonth);
          Object.keys(earliestSnaps).forEach(id => { p[id] = earliestSnaps[id].cny_cents; });
        } else {
          // 没有更早月份，用 assets 表的初始金额
          const allAssets = await DB.all('assets');
          allAssets.forEach(a => { if (!a.archived && a.amount != null) p[a.id] = a.amount; });
        }
        f.prevSnapshots = p;
      } else {
        f.prevSnapshots = prev;
      }
      const r = E.calcMonth(f);
      if (settledSet.has(m) || m === fromMonth) {
        await DB.put('calcSnapshots', {
          id: m, month: m, user_id: 'local',
          income_total: r.incomeTotal, expense_total: r.expenseTotal,
          savings: r.savings, total_assets: r.totalAssets, asset_change: r.assetChange,
          theoretical_assets: r.theoreticalAssets, anomaly_diff: r.anomalyDiff,
          asset_values: r.assetValues, reasons: r.assetChangeReasons,
          causes: r.anomalyCauses, calculation_version: DB.CALC_VERSION,
          updated_at: new Date().toISOString(),
        });
      }
      prev = r.assetValues;
    }
    // 年度汇总（B2：该年无目标也刷新为 0，避免残留旧年份错目标）
    await this.saveYearlySummary(year, goal || 0);
    return prev;
  },
  allMonthsSince(fromMonth) {
    const end = nowMonth() < fromMonth ? fromMonth : nowMonth();
    const out = []; let cur = fromMonth;
    let guard = 0;
    while (cur <= end && guard < 600) { out.push(cur); cur = E.addMonth(cur, 1); guard++; }
    return out;
  },

  async saveYearlySummary(year, goalCents) {
    const snaps = await DB.all('calcSnapshots');
    const ym = year + '-';
    const months = snaps.filter(s => s.month.startsWith(ym) && s.month <= nowMonth()).sort((a, b) => a.month < b.month ? -1 : 1);
    let cum = 0;
    months.forEach(s => { cum = E.roundCents(cum + s.savings); });
    // 全年预测：已发生实际 + 未来月份预测（近 3 个月存钱均值 × 剩余月数；1.0 不预测支出）
    const settled = months.slice(-3);
    const avgMonthly = settled.length ? E.roundCents(settled.reduce((a, s) => a + s.savings, 0) / settled.length) : 0;
    const remain = 12 - months.length;
    const userForecast = await this.getForecast(year);
    let future = 0;
    if (userForecast && userForecast.monthly !== undefined) {
      future = E.roundCents(userForecast.monthly * remain);
    } else {
      future = E.roundCents(avgMonthly * remain);
    }
    const yearEndForecast = E.roundCents(cum + future);
    await DB.setMeta('yearly-' + year, {
      year, cumulative: cum, goal: goalCents,
      progress: goalCents > 0 ? Math.round(cum / goalCents * 10000) / 100 : 0,
      remaining: E.roundCents(goalCents - cum),
      yearEndForecast,
      forecastGap: E.roundCents(yearEndForecast - goalCents),
      forecastBasis: { avgMonthly, remain, settledMonths: months.length, userOverride: !!(userForecast && userForecast.monthly !== undefined) },
      updated_at: new Date().toISOString(),
    });
  },
  async getForecast(year) {
    return await DB.get('forecasts', 'f' + year);
  },

  /* 年度目标 */
  async getYearly(year) {
    const g = await DB.get('goals', 'g' + year);
    if (!g) return null;
    return g;
  },
  async setYearly(year, targetCents, reason) {
    const g = await this.getYearly(year);
    if (g && g.current_target !== targetCents) {
      await DB.put('goalHistory', {
        id: DB.genId(), goal_id: g.id, old_target: g.current_target,
        new_target: targetCents, changed_at: new Date().toISOString(), reason: reason || '',
      });
      g.current_target = targetCents;
      await DB.put('goals', g);
    } else if (!g) {
      const ng = { id: 'g' + year, year, original_target: targetCents, current_target: targetCents, created_at: new Date().toISOString() };
      await DB.put('goals', ng);
    }
    await DB.Sync.enqueue('goals', 'g' + year, 'upsert', { year, current_target: targetCents });
    return targetCents;
  },

  /* 汇率：Frankfurter 主源 + 缓存 + 冻结 */
  async getFxRates(currencies) {
    const need = currencies.filter(c => c !== 'CNY');
    const out = {};
    let fresh = false;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const url = 'https://api.frankfurter.dev/v1/latest?base=CNY&symbols=' + need.join(',');
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (res.ok) {
        const j = await res.json();
        const date = j.date || new Date().toISOString().slice(0, 10);
        for (const c of need) {
          const r = j.rates && j.rates[c];
          if (r) {
            const rateToCny = 1 / r;
            out[c] = { rate: E.roundCents(rateToCny * 100000) / 100000, date, source: 'frankfurter', fetchedAt: new Date().toISOString() };
            await DB.put('fxRates', { id: c + '-' + date, currency: c, rate_to_cny: out[c].rate, rate_date: date, source: 'frankfurter', fetched_at: new Date().toISOString() });
          }
        }
        fresh = true;
      }
    } catch (e) { /* 离线/失败 → 用缓存 */ }
    for (const c of need) {
      if (!out[c]) {
        const cached = await DB.byIndex('fxRates', 'currency', c);
        if (cached.length) {
          const last = cached.sort((a, b) => a.rate_date < b.rate_date ? 1 : -1)[0];
          out[c] = { rate: last.rate_to_cny, date: last.rate_date, source: 'cache', stale: true };
        }
      }
    }
    return { rates: out, fresh };
  },
};

/* ---------- AI 结论生成器（规则引擎：结论→原因→建议，数字全部来自计算引擎） ---------- */
const AI = {
  build(month, r, prev, yearly, prefs, context) {
    const savings = r.savings;
    const incomeT = (r.incomeTotal !== undefined ? r.incomeTotal : r.income_total) || 0;
    const expenseT = (r.expenseTotal !== undefined ? r.expenseTotal : r.expense_total) || 0;
    const goalCents = yearly.goal || 0;
    // 文案按目标减预测确定缺口，不依赖历史汇总字段的正负约定。
    const forecastGap = E.roundCents(goalCents - (yearly.yearEndForecast || 0));
    const cum = yearly.cumulative || 0;
    const prefRank = prefs || { saving: 1, lifestyle: 2, security: 3, growth: 4, investment: 5 };
    const lifestyleHigh = prefRank.lifestyle <= 2;
    let title;
    if (savings > 0) title = '这个月存下了 ' + fmtYuan(savings) + '，' + (cum >= goalCents && goalCents > 0 ? '年度目标已经达成' : '离目标更近了一步');
    else if (savings === 0) title = '这个月收支打平，没存下钱';
    else title = '这个月花了比存的多 ' + fmtYuan(-savings);

    const body = [];
    body.push('本月收入 ' + fmtYuan(incomeT) + '，支出 ' + fmtYuan(expenseT) + '，存钱 ' + fmtYuan(savings) + '。');
    if (goalCents > 0) body.push('年度累计存钱 ' + fmtYuan(cum) + '，目标 ' + fmtYuan(goalCents) + '，完成率 ' + yearly.progress.toFixed(1) + '%。');
    if (context.avgExpense && expenseT > context.avgExpense * 1.15) {
      body.push('支出比近三个月平均高了 ' + fmtYuan(expenseT - context.avgExpense) + '，这是本月存钱的主要拖累。');
    }
    const fx = (r.assetChangeReasons || []).find(x => x.key === 'fx');
    if (fx) body.push('外币汇率变化带来资产变动 ' + fmtYuan(fx.amount) + '（只影响总资产，不影响存钱）。');
    let anomaly = null;
    if (Math.abs(r.anomalyDiff) > 0.5) {
      anomaly = { diff: r.anomalyDiff, causes: r.anomalyCauses.slice(0, 4), text: '理论资产与实际资产相差 ' + fmtYuan(r.anomalyDiff) + '。' };
      body.push('资产校验发现差异 ' + fmtYuan(r.anomalyDiff) + '，下面列出了最可能的原因。');
    }

    const suggestions = [];
    if (savings < 0) {
      const over = context.avgExpense ? expenseT - context.avgExpense : 0;
      if (over > 0 && lifestyleHigh) suggestions.push('先别动生活质量：只找可调整支出里最没价值的两三项，砍掉约 ' + fmtYuan(Math.min(over, -savings)) + ' 就够回正。');
      else if (over > 0) suggestions.push('可调整支出比常态高 ' + fmtYuan(over) + '，优先压缩其中重复、低价值的项目。');
      else suggestions.push('这月收入低于支出，先检查是否有漏记的收入或支出分类有误。');
    }
    if (goalCents > 0 && forecastGap > 0) {
      const remainMonths = Math.max(1, 12 - Number(month.slice(5)));
      const perMonth = E.roundCents(forecastGap / remainMonths);
      suggestions.push('按目前趋势，全年可能差 ' + fmtYuan(forecastGap) + '。剩余 ' + remainMonths + ' 个月，平均每月追回 ' + fmtYuan(perMonth) + ' 就够了，不需要把生活过成苦行僧。');
    }
    if (savings > 0 && goalCents > 0 && yearly.progress < 60 && Number(month.slice(5)) >= 8) {
      suggestions.push('进度偏慢，看看有没有可调整的固定支出，或想想收入改善机会。');
    }
    if (anomaly) suggestions.push('先处理账不平：按上面可能原因逐项核对，修改后系统会实时重算。');
    if (!suggestions.length) suggestions.push('保持这个节奏。月度 5 分钟结算，数字都替你算好了。');

    return {
      title, body: body.join(' '), suggestions, anomaly,
      basis: [
        { label: '本月存钱', value: fmtYuan(savings) },
        { label: '本月收入 / 支出', value: fmtYuan(incomeT) + ' / ' + fmtYuan(expenseT) },
        { label: '年度累计 / 目标', value: fmtYuan(cum) + ' / ' + fmtYuan(goalCents) },
        { label: '全年预测', value: fmtYuan(yearly.yearEndForecast) },
        { label: '总资产', value: fmtYuan(r.total_assets != null ? r.total_assets : r.totalAssets) },
      ],
    };
  },
};

/* 自然语言记账：一句话解析一笔或多笔；失败返回 null。kind: income | expense */
/* 中文金额 → 数字元：支持 两万/1万/三千五/200/3.5万 */
AI.zhToYuan = function (v) {
  if (v == null) return NaN;
  let t = String(v).trim().replace(/,/g, '');
  if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  if (/^十[一二三四五六七八九]$/.test(t)) t = '一' + t;
  const d = { '零':0,'一':1,'两':2,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
  const num = (tok) => (d[tok] != null ? d[tok] : parseFloat(tok));
  let total = 0;
  let m = t.match(/(\d+(?:\.\d+)?|[零一二两三四五六七八九])\s*万/);
  if (m) { total += num(m[1]) * 10000; t = t.replace(m[0], ''); }
  m = t.match(/(\d+(?:\.\d+)?|[零一二两三四五六七八九])\s*千/);
  if (m) { total += num(m[1]) * 1000; t = t.replace(m[0], ''); }
  m = t.match(/(\d+(?:\.\d+)?|[零一二两三四五六七八九])\s*百/);
  if (m) { total += num(m[1]) * 100; t = t.replace(m[0], ''); }
  m = t.match(/(\d+|[零一二两三四五六七八九])\s*十/);
  if (m) { total += num(m[1]) * 10; t = t.replace(m[0], ''); }
  if (total > 0 && t) {
    const single = /^[零一二两三四五六七八九]$/.test(t) ? d[t] : undefined;
    if (single !== undefined) {
      // 口语省略低一级单位：三千五=3500
      total += single * (total >= 10000 ? 1000 : total >= 1000 ? 100 : total >= 100 ? 10 : 1);
    } else if (/^\d+(\.\d+)?$/.test(t)) {
      const mult = total >= 10000 ? 1000 : total >= 1000 ? 100 : total >= 100 ? 10 : 1;
      total += parseFloat(t) * mult;
    } else {
      // 带"零"的标准写法：三千零五=3005
      const sub = cnNumStandard(t);
      if (sub != null) total += sub;
    }
  }
  return total > 0 ? total : NaN;
};
/* 本地兜底：一句话多笔 + 中文数字 */
AI.parseMoneyFallback = function (text, kind) {
  const zh = kind === 'income' ? '收入' : '支出';
  const segs = text.split(/[,，、;；。\n]/).map(x => x.trim()).filter(Boolean);
  const items = [];
  for (const seg of segs) {
    const m = seg.match(/(\d+(?:\.\d+)?\s*[万千百]?|[零一二两三四五六七八九]+[万千百][零一二两三四五六七八九]?)/);
    if (!m) continue;
    const yuan = this.zhToYuan(m[1]);
    if (isNaN(yuan) || yuan <= 0) continue;
    const name = seg.replace(m[0], '').replace(/[块元钱人民币]/g, '').trim() || zh;
    items.push({ amount: yuan, name, note: text });
  }
  return items.length ? { items } : null;
};
AI.parseMoney = async function (text, kind) {
  const cfg = App.state.ai;
  if (!cfg || !cfg.apiKey || !cfg.baseUrl || !cfg.model) return null;
  const zh = kind === 'income' ? '收入' : '支出';
  try {
    const resp = await QYSAITransport.fetch(cfg.baseUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: '你是记账助手。从用户的一句话里提取一笔或多笔' + zh + '。用户一句话里可能提到多笔，要逐笔拆开。严格返回JSON（不要解释、不要markdown）：{"items":[{"amount":金额数字(单位元,必须是阿拉伯纯数字,如"两万"必须写成20000、"1万"写成10000、"三千五"写成3500),"name":' + zh + '分类/名称,简短,如:工资/奖金 或 餐饮/交通/购物,"note":"备注,可空"}]}。只有一笔时 items 里放一条。金额不明确的不要放进去。' },
          { role: 'user', content: text },
        ],
        temperature: 0.1,
      }),
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    const txt = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    const parsed = AI.extractJson(txt);
    if (!parsed || !Array.isArray(parsed.items)) return null;
    const items = parsed.items
      .map(it => ({ amount: this.zhToYuan(it.amount), name: it.name || zh, note: it.note || text }))
      .filter(it => !isNaN(it.amount) && it.amount > 0);
    return items.length ? { items } : null;
  } catch (e) {
    console.warn('记账识别失败', e);
    return null;
  }
};

/* 真模型接入：结算时调用一次并缓存；首页只读缓存，不每次调 */
AI.promptFor = function (month, r, prev, yearly, prefs, ctx, fb) {
  const yuan = c => Math.round((c || 0) / 100);
  const lines = [
    '当月：' + month,
    '本月收入：' + yuan(r.income_total || r.incomeTotal || 0) + ' 元',
    '本月支出：' + yuan(r.expense_total || r.expenseTotal || 0) + ' 元',
    '本月存钱：' + yuan(r.savings || 0) + ' 元',
    '总资产：' + yuan(r.total_assets || r.totalAssets || 0) + ' 元',
    '较上月资产变化：' + (r.asset_change ?? r.assetChange ?? 0) / 100 + ' 元',
    '年度累计存钱：' + yuan(yearly.cumulative || 0) + ' / 年度目标 ' + yuan(yearly.goal || 0) + ' 元（完成率 ' + (yearly.progress || 0) + '%）',
    '全年预测存钱：' + yuan(yearly.yearEndForecast || 0) + ' 元',
    '用户财务偏好权重（1=最重要）：' + JSON.stringify(prefs || {}),
  ];
  if (ctx && ctx.trend) lines.push('近几个月存钱趋势：' + ctx.trend);
  if (ctx && ctx.expenseByCat) lines.push('本月支出结构：' + ctx.expenseByCat);
  if (ctx && ctx.assetByType) lines.push('当前资产结构：' + ctx.assetByType);
  if (fb.anomaly) lines.push('注意：资产校验发现差异 ' + fb.anomaly.text + '，原因：' + (fb.anomaly.causes || []).slice(0, 3).map(c => c.label).join('；'));
  return lines.join('\n');
};
/* 调一次大模型，返回 {title,body,suggestions}；失败/未配置返回 null */

/* 财务问答：组上下文 */
AI.buildAskCtx = async function () {
  const yuan = c => Math.round((c || 0) / 100);
  const snapsAll = await DB.all('calcSnapshots');
  const sorted = snapsAll.slice().sort((a, b) => a.month < b.month ? -1 : 1);
  const recent = sorted.slice(-6);
  let lines = [];
  for (const s of recent) {
    const exps = await Svc.listExpense(s.month);
    const expSum = exps.reduce((a, e) => a + (e.amount || 0), 0);
    lines.push(s.month + '：收入' + yuan(s.income_total) + '元，支出' + yuan(expSum) + '元，存钱' + yuan(s.savings) + '元，总资产' + yuan(s.total_assets) + '元');
  }
  const latest = recent[recent.length - 1];
  let expCatLine = '';
  if (latest) {
    const exps = await Svc.listExpense(latest.month);
    const cat = {};
    exps.forEach(e => { const k = e.category || e.cat || e.name || '其他'; cat[k] = (cat[k] || 0) + (e.amount || 0); });
    expCatLine = '\n最新月支出分类：' + Object.entries(cat).map(([k, v]) => k + yuan(v) + '元').join('、');
  }
  const ast = await Svc.listAssets(false);
  const astLine = '\n资产：' + ast.map(a => (a.name || '其他') + yuan(a.cnyCents || 0) + '元').join('、');
  const yearly = await DB.getMeta('yearly-' + curYear());
  const goalLine = yearly ? '\n年度目标' + yuan(yearly.goal) + '元，已存' + yuan(yearly.cumulative || 0) + '元，进度' + (yearly.progress || 0).toFixed(1) + '%，预计年底' + yuan(yearly.yearEndForecast || 0) + '元。' : '';
  return lines.join('\n') + expCatLine + astLine + goalLine;
};

AI.analyzeAnomaly = async function (month, r) {
  const cfg = App.state.ai;
  if (!cfg || !cfg.apiKey || !cfg.baseUrl || !cfg.model) return null;
  const yuan = c => Math.round((c || 0) / 100);
  try {
    const incs = await Svc.listIncome(month);
    const exps = await Svc.listExpense(month);
    const snaps = await Svc.snapshotsOf(month);
    const prevSnaps = await Svc.snapshotsOf(lastMonth(month));
    const incLine = incs.map(i => (i.name || '收入') + ' ' + yuan(i.amount) + '元').join('、') || '无';
    const expLine = exps.map(e => (e.name || '支出') + ' ' + yuan(e.amount) + '元').join('、') || '无';
    const snapLine = Object.keys(snaps).map(id => {
      const s = snaps[id]; const p = prevSnaps[id];
      return (s.name || id) + '：上月' + yuan(p ? p.cny_cents : 0) + ' → 本月' + yuan(s.cny_cents);
    }).join('、') || '无';
    const data = '差异额：' + yuan(r.anomaly_diff) + '元\n收入明细：' + incLine + '\n支出明细：' + expLine + '\n资产变化：' + snapLine;
    const sys = '你是个人财务审计助手。用户这个月账不平：理论资产和实际资产有差异。根据收支明细和资产变化，找出最可能漏记或多记的1到3项。严格返回JSON（不要markdown不要解释）：{"findings":[{"cause":"最可能的原因,简短","amount":"大概金额数字(元)","fix":"怎么补记,一句话"}]}。不确定就少列，不要编。';
    const resp = await QYSAITransport.fetch(cfg.baseUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: sys },
          { role: 'user', content: data },
        ],
        temperature: 0.3,
      }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const r2 = await resp.json();
    let txt = (r2.choices && r2.choices[0] && r2.choices[0].message && r2.choices[0].message.content) || '';
    txt = txt.replace(/<think>[\s\S]*?<\/think>/g, '');
    const parsed = AI.extractJson(txt);
    return (parsed && Array.isArray(parsed.findings)) ? parsed.findings.slice(0, 3) : null;
  } catch (e) {
    console.warn('归因失败', e);
    return null;
  }
};

/* 从模型文本中括号配平提取第一个完整 JSON 对象 */
AI.extractJson = function (txt) {
  if (!txt) return null;
  const start = txt.indexOf('{');
  if (start < 0) return null;
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < txt.length; i++) {
    const ch = txt[i];
    if (esc) { esc = false; continue; }
    if (ch === '\\') { esc = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === '{') depth++;
    else if (ch === '}') {
      depth--;
      if (depth === 0) {
        try { return JSON.parse(txt.slice(start, i + 1)); } catch (e) { return null; }
      }
    }
  }
  return null;
};

/* ---------- 特殊事项自然语言解析（只产生候选，需用户确认） ---------- */
const Parser = {
  parse(text) {
    const t = text.trim();
    const num = t.match(/(\d+(?:[.,]\d+)?)/g);
    if (!num) return null;
    const money = Math.round(parseFloat(num[0].replace(/,/g, '')) * 100);
    const has = (re) => re.test(t);
    if (has(/收入|工资|奖金|兼职|分红|入账|收到|进账|红包|利息/) && !has(/还款|还我|收回/)) {
      return { kind: 'income', label: '收入', name: pickName(t, /收入|工资|奖金|兼职|分红|利息|红包/), amount: money, confidence: 'high' };
    }
    if (has(/支出|房租|买菜|吃饭|打车|购物|买|缴费|付|消费|水电|话费|保险/) && !has(/还我|收回|朋友还/)) {
      return { kind: 'expense', label: '支出', name: pickName(t, /房租|买菜|吃饭|打车|购物|缴费|水电|话费|保险|消费/), amount: money, confidence: 'high' };
    }
    if (has(/借出|借给|借款出/)) return { kind: 'lend', label: '借出款', name: '借出', amount: money, confidence: 'high' };
    if (has(/还我|还款|朋友还|收回|归还/)) return { kind: 'repay', label: '收回借款', name: '收回借款', amount: money, confidence: 'high' };
    if (has(/坏账|收不回来/)) return { kind: 'writeoff', label: '确认坏账', name: '坏账', amount: money, confidence: 'high' };
    if (has(/卖|卖出|清仓/)) {
      const principal = num.length > 1 ? Math.round(parseFloat(num[1].replace(/,/g, '')) * 100) : null;
      return { kind: 'sell', label: '投资卖出', name: pickName(t, /股票|基金|投资|理财|债/), amount: money, principal, confidence: principal ? 'high' : 'medium' };
    }
    if (has(/买入|买基金|申购|定投/)) return { kind: 'buy', label: '投资买入', name: pickName(t, /股票|基金|投资|理财|债/), amount: money, confidence: 'high' };
    if (has(/收益|盈利|赚/) && has(/股票|基金|投资/)) return { kind: 'userIncome', label: '投资收益（已扣除本金）', name: '投资收益', amount: money, confidence: 'high' };
    return null;
  },
};
function pickName(t, re) {
  const m = t.match(re);
  return m ? m[0] : '项目';
}

  const PREFS = ['saving', 'lifestyle', 'security', 'growth', 'investment'];
  const arr = this.prefOrder || PREFS;
  const i = arr.indexOf(k);
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  this.prefOrder = arr.slice();
  this.renderInitPrefs($('#initBody'));
};


App._bindTouchDrag = function(listSel, orderKey, tagSel) {
  const list = $(listSel);
  if (!list) return;
  let dragEl = null, startY = 0, moved = false;
  list.addEventListener('touchstart', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    dragEl = item; startY = e.touches[0].clientY; moved = false;
    item.classList.add('dragging');
  }, {passive: true});
  list.addEventListener('touchmove', e => {
    if (!dragEl) return;
    const y = e.touches[0].clientY;
    if (!moved && Math.abs(y - startY) < 8) return;
    moved = true; e.preventDefault();
    const items = $$(listSel + ' .item');
    for (const el of items) {
      if (el === dragEl) continue;
      const r = el.getBoundingClientRect();
      if (y > r.top && y < r.bottom) { list.insertBefore(dragEl, el); break; }
    }
  }, {passive: false});
  list.addEventListener('touchend', () => {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    if (orderKey) this[orderKey] = $$(listSel + ' .item').map(el => el.dataset.k);
    $$(listSel + ' .item').forEach((el, i) => {
      const t = el.querySelector(tagSel || '.tag'); if (t) t.textContent = i + 1;
    });
    dragEl = null;
  });
};

App._bindPrefDrag = function () {
  this._bindTouchDrag('#prefList', 'prefOrder', '.tag.blue');
};

App.findPendingMonth = async function () {
  const snapsAll = await DB.all('calcSnapshots');
  const initialMonths = await QYSUI.initialMonths();
  const settled = new Set(snapsAll.filter(s => !initialMonths.has(s.month)).map(s => s.month));
  const initM = await this.initMonth();
  if (!initM) return null;
  let cur = initM;
  const end = nowMonth();
  let guard = 0;
  while (cur <= end && guard < 240) {
    if (!settled.has(cur)) return cur;
    cur = E.addMonth(cur, 1); guard++;
  }
  return null;
};

App.initMonth = async function () {

/* ---------- 图表（内联 SVG：圆角柱状 / 进度环 / 三线预测 / 构成环） ---------- */
App.ring = function (progress) {
  const p = Math.max(0, Math.min(100, progress));
  const r = 34, c = 2 * Math.PI * r;
  const off = c * (1 - p / 100);
  const track = cssVar('--track'), ink = cssVar('--text'), axis = cssVar('--axis');
  return `<svg width="88" height="88" viewBox="0 0 88 88">
    <circle cx="44" cy="44" r="${r}" stroke="${track}" stroke-width="9" fill="none"/>
    <circle cx="44" cy="44" r="${r}" stroke="url(#gg)" stroke-width="9" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 44 44)" style="transition:stroke-dashoffset .3s cubic-bezier(.2,.8,.2,1);"/>
    <text x="44" y="40" text-anchor="middle" fill="${ink}" font-size="15" font-weight="700" font-family="var(--mono)">${p.toFixed(0)}%</text>
    <text x="44" y="56" text-anchor="middle" fill="${axis}" font-size="8">已完成</text>
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00C26B"/><stop offset="100%" stop-color="#009A55"/></linearGradient></defs>
  </svg>`;
};

App.barChart = function (items, opts) {
  // items: [{label, value, mark}] value 为分
  opts = opts || {};
  const C = { axis: cssVar('--axis'), neg: cssVar('--red'), track: cssVar('--track'), green: cssVar('--green-text'), gold: cssVar('--gold-bar') };
  const W = 320, H = 150, padB = 22, padT = 10;
  const max = Math.max(1, ...items.map(i => Math.abs(i.value))) * 1.15;
  const bw = Math.min(34, (W - items.length * 8) / items.length);
  let bars = '';
  items.forEach((it, i) => {
    const h = Math.max(2, Math.abs(it.value) / max * (H - padB - padT));
    const y = H - padB - h;
    const x = i * (bw + 8) + 4;
    const color = it.mark ? C.gold : (it.value >= 0 ? 'url(#barG)' : C.neg);
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${bw * 0.28}" fill="${color}"/>
      <text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="9" fill="${C.axis}">${it.label}</text>
      ${it.value !== null ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="8.5" fill="${it.value >= 0 ? C.green : C.axis}" font-family="var(--mono)">${(it.value / 100).toFixed(0)}</text>` : ''}`;
  });
  return `<div class="chart-title">${opts.title || ''}${opts.sub || ''}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    <defs><linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00C26B"/><stop offset="100%" stop-color="#009A55"/></linearGradient></defs>
    ${bars}
  </svg>`;
};

App.trendChart = async function () {
  const snapsAll = await DB.all('calcSnapshots');
  const sorted = snapsAll.slice().sort((a, b) => a.month < b.month ? -1 : 1);
  if (!sorted.length) return '';
  const curYear = sorted[sorted.length - 1].month.slice(0, 4);
  const yearSnaps = sorted.filter(s => s.month.startsWith(curYear));
  const byMonth = {};
  yearSnaps.forEach(s => { byMonth[Number(s.month.slice(5))] = s; });
  const items = [];
  for (let m = 1; m <= 12; m++) {
    const s = byMonth[m];
    items.push({ label: m + '月', value: s ? s.savings : null });
  }
  return `<div style="margin-top:12px;">${this.barChart(items, { title: curYear + ' 年存钱走势' })}</div>`;
};

App.forecastChart = async function (yearly) {
  if (!yearly) return '';
  const snapsAll = await DB.all('calcSnapshots');
  const ym = curYear() + '-';
  const months = snapsAll.map(s => s.month).filter(m => m.startsWith(ym)).sort();
  const W = 320, H = 150, padB = 22, padT = 12;
  const C = { axis: cssVar('--axis'), green: cssVar('--green'), amber: cssVar('--amber') };
  const goal = yearly.goal || 0;
  const max = Math.max(goal, yearly.yearEndForecast || 0) * 1.1 || 1;
  const pts = [];
  const n = 12;
  for (let i = 0; i < n; i++) {
    const m = ym + String(i + 1).padStart(2, '0');
    const r = months.indexOf(m) >= 0 ? snapsAll.find(s => s.month === m) : null;
    const cum = r ? r.savings + (pts.length ? pts[pts.length - 1].cum : 0) : (pts.length ? pts[pts.length - 1].cum : 0);
    // 未来：用年度预测线性铺开（按剩余月平均）
    let fut = null;
    if (!r && i > 0) {
      const pastSum = snapsAll.filter(s => s.month.startsWith(ym)).reduce((a, s) => a + s.savings, 0);
      const fe = yearly.yearEndForecast || 0;
      const future = Math.max(0, fe - pastSum);
      const remain = Math.max(1, n - months.length);
      fut = pastSum + future * ((i - months.length + 1) / remain);
    }
    pts.push({ m, r: !!r, cum: r ? cum : fut, i });
  }
  const x = i => 14 + i / (n - 1) * (W - 28);
  const y = v => H - padB - v / max * (H - padB - padT);
  let actual = '', forecast = '', goalLine = '', aFirst = true, fFirst = true;
  pts.forEach((p, i) => {
    if (p.cum === null || p.cum === undefined) return;
    if (p.r) { actual += (aFirst ? 'M' : ' L') + x(i).toFixed(1) + ' ' + y(p.cum).toFixed(1); aFirst = false; }
    else { forecast += (fFirst ? 'M' : ' L') + x(i).toFixed(1) + ' ' + y(p.cum).toFixed(1); fFirst = false; }
  });
  if (goal > 0) goalLine = `<line x1="14" y1="${y(goal)}" x2="${W - 14}" y2="${y(goal)}" stroke="${C.axis}" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  const monthLabels = pts.filter(p => p.m.slice(5) === '01' || p.m.slice(5) === '06' || p.m.slice(5) === '12').map(p => `<text x="${x(p.i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="${C.axis}">${Number(p.m.slice(5))}月</text>`).join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    ${goalLine}
    ${monthLabels}
    ${actual ? `<path d="${actual}" fill="none" stroke="${C.green}" stroke-width="2.5" stroke-linecap="round"/>` : ''}
    ${forecast ? `<path d="${forecast}" fill="none" stroke="${C.amber}" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>` : ''}
  </svg>
  <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--text3);">
    <span style="display:inline-flex;align-items:center;gap:5px;"><i style="width:16px;height:0;border-top:2.5px solid ${C.green};display:inline-block;"></i>已发生</span>
    <span style="display:inline-flex;align-items:center;gap:5px;"><i style="width:16px;height:0;border-top:2.5px dashed ${C.amber};display:inline-block;"></i>预测</span>
    ${goal > 0 ? `<span style="display:inline-flex;align-items:center;gap:5px;"><i style="width:16px;height:0;border-top:1.5px dashed ${C.axis};display:inline-block;"></i>目标 ${(goal/100).toLocaleString()}</span>` : ''}
  </div>`;
};

App.assetDonut = async function (cur) {
  if (!cur || !cur.asset_values) return '';
  const vals = cur.asset_values;
  const assets = await Svc.listAssets(true);
  const COLOR = QYSUI.assetColors();
  const groups = {};
  assets.forEach(a => { groups[a.type] = groups[a.type] || { label: a.typeName || a.type, value: 0 }; });
  Object.keys(vals).forEach(id => {
    const a = assets.find(x => x.id === id);
    if (!a) return;
    groups[a.type] = groups[a.type] || { label: a.typeName || a.type, value: 0 };
    groups[a.type].value += vals[id];
  });
  const list = Object.keys(groups).map(k => ({ ...groups[k], color: COLOR[k] || '#C7C7CC' })).filter(g => g.value > 0).sort((a, b) => b.value - a.value);
  const total = list.reduce((a, g) => a + g.value, 0);
  if (!total) return '<div class="empty">暂无资产数据</div>';
  const shown = list.length > 5
    ? list.slice(0, 5).concat([{ label: '其他', value: list.slice(5).reduce((a, g) => a + g.value, 0), color: '#C7C7CC' }])
    : list;
  const W = 200, H = 200, cx = 100, cy = 100, R = 72;
  const cardCol = cssVar('--card'), trackCol = cssVar('--track'), textCol = cssVar('--text');
  const C = 2 * Math.PI * R;
  const SW = 26;
  let accLen = 0;
  const segs = shown.map(g => {
    const frac = g.value / total;
    const len = frac * C;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${g.color}" stroke-width="${SW}"
      stroke-dasharray="${(len - 1.5).toFixed(2)} ${(C - len + 1.5).toFixed(2)}" stroke-dashoffset="${(-accLen).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    accLen += len;
    return seg;
  }).join('');
  const legend = shown.map(g => {
    const pct = g.value / total * 100;
    return `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;">
      <span style="width:10px;height:10px;border-radius:3px;background:${g.color};flex:none;margin-top:3px;"></span>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span style="font-size:12.5px;color:var(--text3);">${g.label}</span>
          <span style="font-size:12.5px;font-weight:600;">${pct.toFixed(0)}%</span>
        </div>
        <div style="font-size:12.5px;font-weight:600;margin-top:1px;">${fmtYuan(g.value)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:14px;margin-top:10px;">
    <svg viewBox="0 0 ${W} ${H}" style="width:132px;flex:none;">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${trackCol}" stroke-width="${SW}"/>
      ${segs}
      <text x="${cx}" y="${cy + 1}" text-anchor="middle" font-size="11" font-weight="600" fill="${textCol}">总资产</text>
      <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="8.5" fill="${cssVar('--text4')}">${list.length} 类资产</text>
    </svg>
    <div style="flex:1;min-width:0;">${legend}</div>
  </div>`;
};

/* ============================================================
 * 总资产走势折线（明细页）
 * ============================================================ */
App.assetTrendChart = async function () {
  const all = await DB.all('calcSnapshots');
  const byM = {};
  all.forEach(s => { byM[s.month] = s; });
  const cur = await this.latestSettledMonth();
  if (!cur) return '<div class="empty" style="padding:20px 8px;">完成结算后显示走势</div>';
  const [cy, cm] = cur.split('-').map(Number);
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(cy, cm - 1 - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  const cells = months.map(mo => byM[mo] ? { mo, v: byM[mo].total_assets } : null);
  const present = cells.filter(Boolean);
  if (present.length < 2) return '<div class="empty" style="padding:20px 8px;">至少结算 2 个月后，这里会显示总资产走势</div>';
  const W = 320, H = 150, padL = 34, padR = 14, padT = 18, padB = 24;
  const n = cells.length;
  const vals = present.map(c => c.v);
  let yMin = Math.min(...vals), yMax = Math.max(...vals);
  if (yMax === yMin) yMax = yMin + 100000;
  const pad = (yMax - yMin) * 0.15; yMax += pad; yMin = Math.max(0, yMin - pad);
  const x = i => padL + i * (W - padL - padR) / (n - 1);
  const y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);
  let line = '', started = false;
  cells.forEach((c, i) => {
    if (!c) return;
    line += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(c.v).toFixed(1) + ' ';
    started = true;
  });
  const pts = cells.map((c, i) => c ? `<circle cx="${x(i).toFixed(1)}" cy="${y(c.v).toFixed(1)}" r="3" fill="${cssVar('--green')}"/>` : '').join('');
  const labs = cells.map((c, i) => {
    const mo = Number(months[i].slice(5));
    const yr = months[i].slice(2, 4);
    const label = mo === 1 ? yr + '/' + mo + '月' : mo + '月';
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="8" fill="${cssVar('--axis')}">${label}</text>`;
  }).join('');
  const fi = cells.indexOf(present[0]), li = cells.indexOf(present[present.length - 1]);
  const wan = v => (v / 1000000).toFixed(1) + '万';
  const vlab = `<text x="${x(fi) + 2}" y="${y(present[0].v) - 6}" font-size="8.5" fill="${cssVar('--text4')}">${wan(present[0].v)}</text>
    <text x="${x(li) - 2}" y="${y(present[present.length - 1].v) - 6}" text-anchor="end" font-size="9" font-weight="600" fill="${cssVar('--green-text')}">${wan(present[present.length - 1].v)}</text>`;
  return `<div class="chart-title">近 12 个月总资产走势</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;">
      <path d="${line}" fill="none" stroke="${cssVar('--green')}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts}${labs}${vlab}
    </svg>`;
};

App.renderHistory = async function (params) {
  const initialMonths = await QYSUI.initialMonths();
  const snapsAll = (await DB.all('calcSnapshots')).filter(s => !initialMonths.has(s.month)).slice().sort((a, b) => a.month < b.month ? 1 : -1);
  if (!snapsAll.length) { this.setView('history', '<div class="empty" style="padding-top:80px;">完成第一个月结算后，这里会展示历史</div>'); return; }
  const years = [...new Set(snapsAll.map(s => s.month.slice(0, 4)))].sort((a, b) => b < a ? 1 : -1);
  let year = (params && params.get('year')) || years[0];
  if (years.indexOf(year) < 0) year = years[0];
  const yearSnaps = snapsAll.filter(s => s.month.startsWith(year));
  const byMonth = {};
  yearSnaps.forEach(s => { byMonth[Number(s.month.slice(5))] = s; });
  const items = [];
  for (let m = 1; m <= 12; m++) {
    const s = byMonth[m];
    items.push({ label: m + '月', value: s ? s.savings : null });
  }
  const best = yearSnaps.filter(s => s.savings > 0).sort((a, b) => b.savings - a.savings)[0];
  // 年度累计：该年 1 月到各月的存钱累计（B1）
  const yearCum = {};
  { let acc = 0;
    yearSnaps.slice().sort((a, b) => a.month < b.month ? -1 : 1).forEach(sn => {
      acc = E.roundCents(acc + (sn.savings || 0));
      yearCum[sn.month] = acc;

  }
  const yearSel = `<div style="display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;">
    <select onchange="App.go('history','year='+this.value)" style="appearance:none;-webkit-appearance:none;border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--text);outline:none;cursor:pointer;padding:0;margin:0;">
      ${years.map(y => `<option value="${y}" ${y === year ? 'selected' : ''}>${y} 年</option>`).join('')}
    </select>
    <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>`;
  const chart = this.barChart(items, {
    title: year + ' 年存钱',
    sub: yearSel
  });
  const cardsHtml = snapsAll.filter(s => s.month.startsWith(year)).map(r => {
    const isBest = best && r.month === best.month;
    return `
    <div class="card" style="cursor:pointer;" onclick="App.go('settle','m=${r.month}')">
      <div class="row">
        <div><b style="font-size:15px;">${monthCn(r.month)}</b> ${isBest ? '<span class="tag" style="background:var(--gold-bg);color:var(--gold-text);">年度最佳</span>' : ''}</div>
        <span class="big ${r.savings < 0 ? 'num-neg' : 'num-pos'}" style="font-size:18px;">${fmtYuan(r.savings)}</span>
      </div>
      <div style="font-size:11.5px;color:var(--text4);margin-top:4px;">年度累计 ${fmtYuan(yearCum[r.month] || 0)} · 总资产 ${fmtYuan(r.total_assets)}</div>
    </div>`;
  }).join('');
  this.setView('history', `
    <h1 class="page">历史</h1>
    <p class="sub">每个月的结算记录，点击进入当月详情</p>
    <div class="card">${chart}</div>
    ${cardsHtml}`);
