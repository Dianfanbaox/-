App.cumTo = async function (month) {
  const snapsAll = (await DB.all('calcSnapshots')).sort((a, b) => a.month < b.month ? -1 : 1);
  let cum = 0;
  for (const s of snapsAll) { cum = E.roundCents(cum + s.savings); if (s.month === month) return cum; }
  return cum;
};

/* ============================================================
 * 结算流程（四步向导：A收入 B支出 C特殊事项 D资产确认）
 * ============================================================ */
App.renderSettle = async function (params) {
  let m = (params && params.get('m')) || nowMonth();
  const edit = params && params.get('edit');
  this.assetEditIdx = -1; this.assetDeleteIdx = -1;
  this.settle = { month: m, step: 'income' };
  const renderState = this.settle;
  const snapsAll = await DB.all('calcSnapshots');
  if (this.settle !== renderState || this.state.view !== 'settle') return;
  const existing = snapsAll.find(x => x.month === m);
  // 已结算且非编辑 → 直接结果页
  if (existing && !edit && !(await this.isInitialMonth(m)) && ((params && params.get('result') === '1') || !(await this.hasSettlementDraft(m)))) {
    await this.loadSettleDraft();
    if (this.settle !== renderState || this.state.view !== 'settle') return;
    this.settle.step = 'result';
    // 从首页进入已结算月，也生成AI结论
    const yearly = await Svc.getYearly(curYear());
    const ctx = { settled: true, assets: this.settle.assets };
    const fb = AI.build(m, existing, {}, yearly, App.state.prefs || {}, ctx);
    if (this.settle !== renderState || this.state.view !== 'settle') return;
    this.renderSettleResult(existing, fb);
    // 只读缓存，不重新请求大模型（只有数据变化后才重新请求）
    const cached = await DB.getMeta('aiCache-' + m);
    if (cached) {
      const spin = document.getElementById('aiResultSpin');
      if (spin) spin.style.display = 'none';
      const t = document.getElementById('aiResultTitle'); if (t) t.textContent = cached.title;
      const b = document.getElementById('aiResultBody'); if (b) b.textContent = cached.body;
      const sg = document.getElementById('aiResultSug');
      if (sg) sg.innerHTML = (cached.suggestions||[]).map(x => '<div style="font-size:12.5px;color:var(--green-l);padding:3px 0;">· ' + esc(x) + '</div>').join('');
    }
    return;
  }
  await this.loadSettleDraft();
  if (this.settle !== renderState || this.state.view !== 'settle') return;
  const reviewStep = params && params.get('review');
  if (reviewStep) this.beginSettlementReview(reviewStep);
  await this.restoreSettlementDraft();
  if (reviewStep && ['income','expense','special','assets'].includes(reviewStep)) this.settle.step = reviewStep;
  if (this.settle !== renderState || this.state.view !== 'settle') return;
  this.renderSettleStep();
};

App.loadSettleDraft = async function () {
  const draft = this.settle;
  const m = draft.month;
  const [incomes, expenses, assets, snapMap] = await Promise.all([
    Svc.listIncome(m), Svc.listExpense(m), Svc.listAssets(false), Svc.snapshotsOf(m)
  ]);
  // 找最近一个有快照的月份作为基准（不是严格前一个月，中间空月要跳过）
  const allSnaps = await DB.all('snapshots');
  const snapMonths = [...new Set(allSnaps.map(x => x.month))].filter(x => x < m).sort();
  const prevM = snapMonths.length ? snapMonths[snapMonths.length - 1] : null;
  const prevSnaps = prevM ? await Svc.snapshotsOf(prevM) : {};
  // 外币汇率：优先历史快照/资产表汇率，其次最近抓取汇率，最后内置默认（A3）
  const fxCache = {};
  for (const a of assets) {
    const ccy = a.currency || 'CNY';
    if (ccy !== 'CNY' && fxCache[ccy] === undefined) {
      const his = (a.fx_rate) || (snapMap[a.id] && snapMap[a.id].fx_rate) || null;
      fxCache[ccy] = his || (await App.fxRateFor(ccy));
    }
  }
  const assetRows = assets.map(a => {
    const cur = snapMap[a.id], prev = prevSnaps[a.id];
    const prevCents = prev ? prev.cny_cents : null;
    const curCents = cur ? cur.cny_cents : null;
    const isFx = (a.currency || 'CNY') !== 'CNY';
    const fxRate = isFx ? (fxCache[a.currency || 'CNY'] || null) : null;
    let origCents = cur ? (cur.original_cents || null) : (a.original_cents || null);
    // 外币原币基准统一按人民币反推，避免历史脏数据把人民币当原币（A2）
    if (isFx && curCents != null && fxRate) origCents = Math.round(curCents / fxRate);
    return {
      id: a.id, name: a.name, ccy: a.currency || 'CNY',
      origCents, fxRate,
      prevCents,
      newCents: curCents != null ? curCents : (prevCents == null ? (isFx ? null : (a.amount || null)) : null),
      isNew: prevCents == null
    };
  });
  draft.income = incomes.map(i => ({ desc: i.desc || '', amount: i.amount || 0, id: i.id }));
  draft.expense = expenses.map(i => ({ desc: i.desc || '', amount: i.amount || 0, id: i.id }));
  draft.assets = assetRows;
  // 历史特殊事项 → 列表（A1：编辑态可显示/删除）
  const [oldInv, oldLoan, oldSp] = await Promise.all([
    Svc.listInvestments(m), Svc.listLoans(m), Svc.listSpecial(m)
  ]);
  const histSpecial = [];
  oldInv.forEach(v => {
    histSpecial.push({
      raw: v.desc || '', desc: v.desc || '',
      type: v.type === 'buy' ? 'invest_buy' : 'invest_sell',
      amount: v.tx_amount || 0, principal: v.principal_amount || 0,
      profit: v.realized_pnl != null ? v.realized_pnl : 0,
      note: v.note || '', _id: v.id,
    });
  });
  oldLoan.forEach(l => {
    histSpecial.push({
      raw: l.desc || '', desc: l.desc || '',
      type: l.type === 'lend' ? 'loan_give' : 'loan_return',
      amount: Math.abs(l.loan_delta || 0) || Math.abs(l.cash_delta || 0),
      principal: 0, profit: 0, note: l.note || '', _id: l.id,
    });
  });
  oldSp.forEach(sp => {
    const pd = sp.parsed_data || {};
    histSpecial.push({
      raw: sp.raw_text || '', desc: sp.raw_text || '', type: sp.event_type || 'other',
      amount: pd.amount || 0, principal: pd.principal || 0,
      profit: pd.profit || 0, note: pd.note || '', _id: sp.id,
    });
  });
  draft.special = histSpecial;
};

App.settleAssetSave = async function (i) {
  const input = document.getElementById('asset-edit-input');
  const raw = input ? input.value.trim() : '';
  const v = Number(raw);
  const fail = message => {
    toast(message);
    if (input) {
      input.setAttribute('aria-invalid', 'true');
      let error = document.getElementById('asset-edit-error');
      if (!error) { error = document.createElement('p'); error.id = 'asset-edit-error'; error.setAttribute('role', 'alert'); error.className = 'qys-input-error'; input.parentElement.after(error); }
      error.textContent = message;
      input.setAttribute('aria-describedby', error.id);
    }
    return false;
  };
  if (!raw || !Number.isFinite(v)) return fail('请输入有效金额，再确认结算');
  const a = this.settle.assets[i];
  if (!a) return fail('资产记录已变化，请重新选择要编辑的资产');
  const isFx = a.ccy && a.ccy !== 'CNY';
  const fxRate = isFx ? (a.fxRate || (await App.fxRateFor(a.ccy)) || 1) : 1;
  const originalCents = Math.round(v * 100);
  const newCents = isFx ? Math.round(originalCents * fxRate) : originalCents;
  if (!Number.isSafeInteger(originalCents) || !Number.isSafeInteger(newCents)) return fail('金额超出支持范围，请检查输入');
  if (isFx) a.origCents = originalCents;
  a.newCents = newCents;
  this.assetEditIdx = -1;
  this.renderSettleAssets();
  return true;
};

/* 汇率读取：优先 fxRates 缓存（Frankfurter 抓取），无则回退内置默认（A3） */
App.fxRateFor = async function (ccy) {
  if (!ccy || ccy === 'CNY') return 1;
  try {
    // fxRates 未建 currency 索引，用全量过滤（数据量小，性能无影响）
    const rows = await DB.all('fxRates');
    const hit = rows.filter(r => r.currency === ccy);
    if (hit.length) {
      const last = hit.sort((a, b) => (a.rate_date < b.rate_date ? 1 : -1))[0];
      if (last && last.rate_to_cny) return last.rate_to_cny;
    }
  } catch (e) {}
  return (App.FX_DEFAULT && App.FX_DEFAULT[ccy]) || 1;
};
App.settleAddAsset = async function () {

  await Svc.saveSnapshots(this.settle.month, [{
    assetId: saved.id,

/* 快速输入：先本地正则，失败再问 AI */
App.settleQuickAdd = async function (kind) {
  const inp = $('#quickInput');
  const q = (inp.value || '').trim();
  if (!q) return;
  const btn = event && event.target;
  // 先本地按行/标点拆分，每行试 parseMoneyText
  const lines = q.split(/[\n,，；;]+/).map(x => x.trim()).filter(Boolean);
  let local = [];
  let needAI = false;
  for (const line of lines) {
    const p = this.parseMoneyText(line);
    if (p) local.push({ desc: p.desc, amount: p.cents });
    else needAI = true;
  }
  if (!needAI && local.length) {
    local.forEach(x => this.settle[kind].push(x));
    inp.value = '';
    this.renderSettleStep();
    toast(local.length > 1 ? '已记 ' + local.length + ' 笔' : '已记 ' + local[0].desc);
    return;
  }
  // 本地解析不全，问 AI（C2：统一走文档规定的 AI.parseMoney；未配 Key 返回 null 自动回退）
  if (btn) { btn.disabled = true; btn.textContent = '识别中…'; }
  let items = null;
  try { items = await AI.parseMoney(q, kind); } catch (e) {}
  if (!items || !items.items || !items.items.length) {
    try { items = AI.parseMoneyFallback(q, kind); } catch (e) {}
  }
  if (btn) { btn.disabled = false; btn.textContent = '添加'; }
  if (items && items.items && items.items.length) {
    const arr = items.items;
    arr.forEach(d => {
      const amt = d && d.amount != null ? Number(d.amount) : NaN;
      if (!isNaN(amt) && amt > 0) {
        this.settle[kind].push({ desc: String(d.name || d.desc || q).slice(0, 20), amount: Math.round(amt * 100) });
      }
    });
    inp.value = '';
    this.renderSettleStep();
    toast(arr.length > 1 ? '已记 ' + arr.length + ' 笔' : '已记 ' + (arr[0].name || arr[0].desc || ''));
  } else {
    // 兜底：本地已解析的部分先存，剩余当无金额项
    local.forEach(x => this.settle[kind].push(x));
    inp.value = '';
    this.renderSettleStep();
    toast('未识别出金额，请检查格式');
  }
};

// 中文数字转阿拉伯
const CN_NUM = {'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function cnToNum(str) {
  // 支持：两万/2万/三万五/3千5/五百/3.5万/一千二
  if (!str) return null;
  str = str.trim();
  // 纯阿拉伯
  if (/^[0-9.]+$/.test(str)) return parseFloat(str);
  let total = 0, unit = 1;
  // 先处理万
  let wanPart = str, rest = '';
  const wanM = str.match(/^(.+?)万(.*)$/);
  if (wanM) {
    const w = wanM[1];
    const wn = /^[0-9.]+$/.test(w) ? parseFloat(w) : cnSimple(w);
    total = (wn || 1) * 10000;
    rest = wanM[2];
  } else {
    const n = cnSimple(str);
    return n;
  }
  // rest 可能是 "五千"/"5千"/"五百"/"500"/"5"(万后单个=千)（D2：补中文单字与"零"）
  if (rest) {
    const r0 = rest.trim();
    // 万后省略"千"：单字表示千位（两万五=25000 / 三万五=35000）
    if (/^[0-9]$/.test(r0)) { total += parseFloat(r0) * 1000; return total; }
    if (/^[零一二两三四五六七八九]$/.test(r0)) { total += CN_NUM[r0] * 1000; return total; }
    // 万后带单位：2万5千 / 2万五百
    const qianM = r0.match(/^(.+?)千(.*)$/);
    if (qianM) {
      const q = qianM[1];
      const qn = /^[0-9.]+$/.test(q) ? parseFloat(q) : cnSimple(q);
      total += (qn || 1) * 1000;
      rest = qianM[2];
      if (rest && /^[0-9]$/.test(rest.trim())) { total += parseFloat(rest) * 100; rest=''; }
    }
    if (rest) {
      const b = cnSimple(rest);
      if (b) total += b;
      else {
        const std = cnNumStandard(rest);
        if (std != null) total += std;
      }
    }
  }
  return total;
}
function cnSimple(str) {
  // 处理 "五百"/"三千"/"十二"
  if (!str) return null;
  str = str.trim();
  if (/^[0-9.]+$/.test(str)) return parseFloat(str);
  let total = 0;
  const qianM = str.match(/^(.+?)千(.*)$/);
  if (qianM) {
    const q = CN_NUM[qianM[1]] || (parseFloat(qianM[1]) || 1);
    total += q * 1000;
    str = qianM[2];
  }
  const baiM = str.match(/^(.+?)百(.*)$/);
  if (baiM) {
    const b = CN_NUM[baiM[1]] || (parseFloat(baiM[1]) || 1);
    total += b * 100;
    str = baiM[2];
  }
  const shiM = str.match(/^(.+?)十(.*)$/);
  if (shiM) {
    let sNum;
    if (shiM[1] === '') sNum = 1;
    else if (CN_NUM[shiM[1]] !== undefined) sNum = CN_NUM[shiM[1]];
    else if (/^[0-9.]+$/.test(shiM[1])) sNum = parseFloat(shiM[1]);
    else sNum = cnNumStandard(shiM[1]);
    total += (sNum || 1) * 10;
    str = shiM[2];
  }
  if (str) {
    const d = CN_NUM[str];
    if (d !== undefined) {
      // 口语省略低一级单位：千后单字=百位、百后单字=十位（三千五=3500、三百五=350）
      total += d * (total >= 1000 ? 100 : total >= 100 ? 10 : 1);
    } else if (/^[0-9]+$/.test(str)) {
      total += parseFloat(str) * (total >= 1000 ? 100 : total >= 100 ? 10 : 1);
    } else {
      const sub = cnNumStandard(str);
      if (sub != null) total += sub;
    }
  }
  return total || null;
}

/* 标准中文数字（支持"零"占位）：一千零二十=1020 / 三千零五=3005 / 三百零五=305 */
function cnNumStandard(s) {
  if (!s) return null;
  const d = CN_NUM;
  let total = 0, section = 0, num = 0;
  for (const ch of String(s)) {
    if (d[ch] !== undefined && ch !== '十') { num = d[ch]; }
    else if (ch === '十') { section += (num === 0 ? 1 : num) * 10; num = 0; }
    else if (ch === '百') { section += num * 100; num = 0; }
    else if (ch === '千') { section += num * 1000; num = 0; }
    else if (ch === '万') { total += (section + num) * 10000; section = 0; num = 0; }
  }
  const r = total + section + num;
  return r > 0 ? r : null;
}

App.parseMoneyText = function (q) {
  // 提取金额：支持阿拉伯数字 + 中文数字（两万/3千5/五百）
  let yuan = null, desc = q;
  // 匹配"X万"模式（X可以是阿拉伯或中文）
  const wanM = q.match(/([0-9.]+|[一二两三四五六七八九十]+)\s*万([0-9.]+|[一二两三四五六七八九十]+)?/);
  if (wanM) {
    yuan = cnToNum(wanM[0]);
    desc = q.replace(wanM[0], '');
  } else {
    // 匹配纯数字或中文数字（千/百）
    const numM = q.match(/([0-9]+(?:\.[0-9]+)?\s*(?:千|百)([0-9]|[一二两三四五六七八九十])?|[0-9]+\s*(?:千|百)?|[一二两三四五六七八九十]+\s*(?:千|百)?)/);
    if (numM) {
      yuan = cnToNum(numM[1]);
      desc = q.replace(numM[0], '');
    }
  }
  if (yuan == null || isNaN(yuan)) return null;
  desc = desc.replace(/(这个月|本月|今天|我|花了|挣了|用了|付了|收到|块钱|块|元|rmb|RMB)/g, '').replace(/^[的了，,\s]+|[的了，,\s]+$/g, '').trim();
  if (!desc) desc = '记录';
  return { desc: desc.slice(0, 20), cents: Math.round(yuan * 100) };
};

App.settleSpecialParse = async function () {
  const inp = $('#specialInput'), btn = $('#specialBtn');
  const q = (inp.value || '').trim();
  if (!q) return;
  btn.disabled = true; btn.innerHTML = '<span class="spin-dot"></span>';
  // 先本地拆句
  const clauses = q.split(/[，,；;。\n]+/).map(x => x.trim()).filter(Boolean);
  // 合并"本金是xxx"到前一句
  const merged = [];
  clauses.forEach(c => {
    if (/^本金是?\s*\d/.test(c) && merged.length) {
      merged[merged.length - 1] += '，' + c;
    } else {
      merged.push(c);
    }
  });
  let results = merged.map(c => this.parseSpecialLocal(c));
  // 配了 AI Key 就等大模型（准），本地结果先占位
  const aiCfg = App.state && App.state.ai;
  const hasKey = !!(aiCfg && aiCfg.apiKey);
  if (hasKey) {
    try {
      const sys = '你是一个记账助手。把用户这句话解析成特殊财务事件，返回JSON数组。每条格式：{"desc":"简短描述","type":"invest_sell|invest_buy|loan_return|loan_give|other","amount":数字,"principal":数字,"profit":数字,"note":"补充"}。\n\n【类型定义】\n1. invest_sell=投资卖出/收益：两种输入模式：\n   - 模式A"卖出总额"：用户说"卖了X"或"赎回X"，X=卖出到账总额，填amount=X；如果同时提到本金P，填principal=P，profit=X-P。\n   - 模式B"直接收益"：用户说"挣了X""赚了X""收益X"，X=赚到的利润，填profit=X；如果同时提到本金P，填principal=P，amount=P+X。\n   - 关键：用户说"挣了500"就是利润500，不要把500当卖出总额。\n2. invest_buy=投资买入：用户说"买基金/买理财/买入/加仓"，amount=买入金额。\n3. loan_return=别人还我钱：用户说"还我X""朋友还X""还回来X"，amount=收回金额。\n4. loan_give=我借出去钱：用户说"借给X""借出去X"，amount=借出金额。\n5. other=其他不确定的事。\n\n【规则】\n- 一句话含多个事项时拆成数组多条。\n- "本金是P"如果跟在投资句子后面，属于那条投资事，不要单独成条。\n- 所有金额必须是纯数字（元），不要写中文数字（"三千"要转成3000）。\n- 只返回JSON数组，不要解释。';
      const ans = await AI.askChat([{role:'system',content:sys},{role:'user',content:q}]);
      const m = ans && ans.match(/\[[\s\S]*\]/);
      if (m) {
        const arr = JSON.parse(m[0]);
        if (Array.isArray(arr) && arr.length) results = arr;
      }
    } catch(e) {}
  }
  if (!inp.isConnected) return;
  btn.disabled = false; btn.textContent = '解析';
  if (!(await this.reviewSpecial(results, q))) return;
  this.settle.special = this.settle.special || [];
  results.forEach(d => {
    const amt = Math.round((d.amount||0)*100);
    const prin = Math.round((d.principal||0)*100);
    const prof = Math.round((d.profit||0)*100);
    let note = d.note || '';
    if (!note && prin && d.type === 'invest_sell') {
      const p = prof || (amt - prin);
      note = '本金 ' + fmtYuan(prin) + (p ? '，盈亏 ' + fmtYuan(p) : '');
    }
    this.settle.special.push({
      raw: d.desc, desc: d.desc || q, type: d.type || 'other',
      amount: amt, principal: prin, profit: prof, note,
    });
  });
  inp.value = '';
  this.settle.inputs = this.settle.inputs || {};
  this.settle.inputs.special = '';
  this.renderSettleSpecial();
  toast(results.length > 1 ? '已识别 ' + results.length + ' 条' : '已识别');
};

App.parseSpecialLocal = function (q) {
  const s = q;
  // 支持中文数字：三千/两万/一千五/3千5等
  const numRe = /([0-9]+\.?[0-9]*\s*(?:万|千)?|[一二两三四五六七八九十百千万]+)/g;
  const nums = (s.match(numRe) || []).map(x => cnToNum(x));
  const has = (...ks) => ks.some(k => s.includes(k));
  // 投资收益：挣了/赚了/收益/盈利/分红 → X是利润
  if (has('挣了', '赚了', '收益', '盈利', '分红', '赚', '挣')) {
    const profit = nums[0] || 0;
    const principal = nums[1] || 0;
    const amount = principal + profit;
    return {
      type: 'invest_sell',
      desc: s.replace(/[，。\s]+$/,''),
      amount: amount, principal: principal, profit: profit,
      note: principal ? ('本金 ' + fmtYuan(principal*100) + (profit ? '，盈亏 ' + fmtYuan(profit*100) : '')) : '',
    };
  }
  // 投资卖出：卖了/赎回 → X是卖出总额
  if (has('卖', '赎回') || /卖[了出]?/.test(s)) {
    const sellAmt = nums[0] || 0;
    const principal = nums[1] || 0;
    const profit = sellAmt && principal ? sellAmt - principal : 0;
    return {
      type: 'invest_sell',
      desc: s.replace(/[，。\s]+$/,''),
      amount: sellAmt, principal: principal, profit: profit,
      note: principal ? ('本金 ' + fmtYuan(principal*100) + (profit ? '，盈亏 ' + fmtYuan(profit*100) : '')) : '',
    };
  }
  if (has('买基金', '买理财', '买入', '加仓', '定投', '买股')) {
    return { type: 'invest_buy', desc: s.replace(/[，。\s]+$/,''), amount: nums[0] || 0, principal: 0, note: '' };
  }
  // 借出款收回：朋友还/还我/还款/还钱/还了/还回来
  if (has('朋友还', '还我', '还款', '还钱', '还了', '还回来', '收回') && !has('我还', '还给')) {
    return { type: 'loan_return', desc: s.replace(/[，。\s]+$/,''), amount: nums[0] || 0, principal: 0, note: '' };
  }
  if (has('借给', '借出去', '借朋友', '借了', '借出')) {
    return { type: 'loan_give', desc: s.replace(/[，。\s]+$/,''), amount: nums[0] || 0, principal: 0, note: '' };
  }
  return { type: 'other', desc: s, amount: 0, principal: 0, note: '' };
};

App.settleFinish = async function () {
  // 最终确认必须包含当前输入；校验失败时不写入结算。
  if (document.getElementById('asset-edit-input') && !(await this.settleAssetSave(this.assetEditIdx))) return;
  const m = this.settle.month;
  const oldI = await Svc.listIncome(m), oldE = await Svc.listExpense(m);
  for (const x of oldI) await Svc.softDelete('income', x.id);
  for (const x of oldE) await Svc.softDelete('expense', x.id);
  for (const r of this.settle.income) { if (!r.amount) continue; await Svc.saveIncome({ month: m, desc: r.desc, amount: r.amount, to_savings: true }); }
  for (const r of this.settle.expense) { if (!r.amount) continue; await Svc.saveExpense({ month: m, desc: r.desc, amount: r.amount }); }
  // 重建本月资产快照：没改的继承上月余额，外币存原币+汇率（A2/A4）
  const entries = [];
  for (const a of this.settle.assets) {
    let cny = a.newCents;
    const isFx = a.ccy && a.ccy !== 'CNY';
    let fxRate = null, orig = null;
    if (isFx) fxRate = a.fxRate || (await App.fxRateFor(a.ccy)) || 1;
    if (cny == null) {
      if (a.prevCents == null) continue; // 全新资产且未填金额 → 不计入
      cny = a.prevCents;                 // 没改 → 继承上月余额
    }
    if (isFx) orig = a.origCents != null ? a.origCents : Math.round(cny / fxRate);
    entries.push({ assetId: a.id, originalCents: orig, currency: a.ccy, fxRate, cnyCents: cny });
  }
  // 清除本月快照里已被删除（归档）资产的残留记录，避免删除无效
  const monthSnaps = await Svc.snapshotsOf(m);
  for (const id of Object.keys(monthSnaps)) {
    if (!entries.some(e => e.assetId === id)) await DB.del('snapshots', monthSnaps[id].id);
  }
  await Svc.saveSnapshots(m, entries);
  // 特殊事项落库（A1）：先软删本月旧记录，再写确认过的
  const oldInv = await Svc.listInvestments(m), oldLoan = await Svc.listLoans(m), oldSp = await Svc.listSpecial(m);
  for (const x of oldInv) await Svc.softDelete('investments', x.id);
  for (const x of oldLoan) await Svc.softDelete('loans', x.id);
  for (const x of oldSp) await Svc.softDelete('specialEvents', x.id);
  for (const r of this.settle.special || []) {
    if (r.type === 'invest_sell' || r.type === 'invest_buy') {
      const sellP = r.profit != null ? r.profit : ((r.amount || 0) - (r.principal || 0));
      await Svc.saveInvestment({
        month: m, type: r.type === 'invest_sell' ? 'sell' : 'buy',
        tx_amount: r.amount || 0, principal_amount: r.principal || 0,
        realized_pnl: r.type === 'invest_sell' ? sellP : 0,
        calc_source: 'user_parsed', desc: r.desc || r.raw || '', note: r.note || '',
      });
    } else if (r.type === 'loan_return' || r.type === 'loan_give') {
      const isGive = r.type === 'loan_give';
      await Svc.saveLoan({
        month: m, type: isGive ? 'lend' : 'repay',
        cash_delta: isGive ? -(r.amount || 0) : (r.amount || 0),
        loan_delta: isGive ? (r.amount || 0) : -(r.amount || 0),
        writeoff_to_savings: false, desc: r.desc || r.raw || '', note: r.note || '',
      });
    } else {
      await Svc.saveSpecial({
        month: m, event_type: r.type || 'other', raw_text: r.desc || r.raw || '',
        parsed_data: { amount: r.amount || 0, principal: r.principal || 0, profit: r.profit || 0, note: r.note || '' },
        confirmed: true,
      });
    }
  }
  await Svc.recalc(m, { year: m.slice(0, 4) });
  await DB.setMeta('aiCache-' + m, null); // 改本月：清旧AI缓存
  this.settle.step = 'result';
  const snapsAll = await DB.all('calcSnapshots');
  const r = snapsAll.find(x => x.month === m);
  // 准备规则版上下文（与首页一致）
  const months = snapsAll.map(x => x.month).sort();
  const idx = months.indexOf(m);
  const prev = idx > 0 ? snapsAll.find(x => x.month === months[idx - 1]) : null;
  const exps = await Promise.all([1, 2, 3].map(i => Svc.listExpense(E.addMonth(m, -i))));
  const valid = exps.filter(l => l.length);
  const avgExpense = valid.length ? E.roundCents(valid.reduce((a, l) => a + l.reduce((s, e) => s + e.amount, 0), 0) / valid.length) : null;
  const ctx = { avgExpense };
  const yearly = await DB.getMeta('yearly-' + m.slice(0, 4)) || {};
  const fb = AI.build(m, r, prev, yearly, App.state.prefs || {}, ctx);
  this.renderSettleResult(r, fb);
  this.settleAILoad(m, r, prev, yearly, App.state.prefs || {}, ctx, fb);
};

App.doBind = async function () {
  const email = $('#loginEmail').value.trim();
  const p1 = $('#loginPass').value, p2 = $('#loginPass2').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('请输入有效邮箱'); return; }
  if (p1.length < 8) { toast('密码至少 8 位'); return; }
  if (p1 !== p2) { toast('两次密码不一致'); return; }
  // 本地模式：哈希后仅存本地（云端对接留待 Supabase 配置）
  const hash = await this.sha256(email + ':' + p1);
  await DB.setMeta('user', { email, hash: hash.slice(0, 16), bound_at: new Date().toISOString() });
  App.state.user = { email };
  App.sessionVerified = true;
  toast('已绑定（本地模式）');
  App.go('settings');
};

App.sha256 = async function (s) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'local-' + btoa(unescape(encodeURIComponent(s))).slice(0, 16); }
};

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'PersonalWealthOS_Backup_' + today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('备份已导出');
};

App.importBackup = async function (input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload.data || !payload.meta) throw new Error('格式不正确');
    // 导入前内联确认（settings页已处理）
    await DB.importAll(payload);
    App.state.initialized = true;
    App.state.goal = await DB.getMeta('goal');
    toast('导入完成，正在重算');
    await Svc.recalc(await this.initMonth(), { goal: App.state.goal });
    location.hash = '#/home'; this.route();
  } catch (e) {
    toast('导入失败：' + e.message);
  }
  input.value = '';
};

/* 偏好编辑 */
App.renderPrefsEdit = function () {
  const prefs = App.state.prefs || { saving: 1, lifestyle: 2, security: 3, growth: 4, investment: 5 };
  const PREFS = [
    { k: 'saving', label: '存钱速度', desc: '更快的年度目标推进' },
    { k: 'lifestyle', label: '生活质量', desc: '保留生活体验与弹性' },
    { k: 'security', label: '财务安全感', desc: '稳健与安全垫' },
    { k: 'growth', label: '资产增长', desc: '财富长期增值' },
    { k: 'investment', label: '投资机会', desc: '抓住投资窗口' },
  ];
  const order = PREFS.slice().sort((a, b) => prefs[a.k] - prefs[b.k]);
  const html = `
    <h1 class="page">财务偏好</h1>
    <p class="sub">拖动右侧把手排序，1 最重要。AI 建议按此权重调整</p>
    <div class="card" id="prefList2">
      ${order.map((p, i) => `
        <div class="item" data-k="${p.k}">
          <span class="tag blue">${i + 1}</span>
          <div class="nm"><b>${p.label}</b><small>${p.desc}</small></div>
          <div class="grip"><i></i><i></i><i></i></div>
        </div>`).join('')}
    </div>
    <button class="btn" onclick="App.savePrefsEdit()">保存偏好</button>
<button class="btn ghost" onclick="App.go('settings')">返回</button>`;
  this.setView('prefs', html);
  this.prefEditOrder = order.map(p => p.k);
  this._bindPrefEditDrag();
};

App._bindPrefEditDrag = function () {
  this._bindTouchDrag('#prefList2', 'prefEditOrder', '.tag');
};

App.prefEditMove = function (k, dir) {
  const arr = this.prefEditOrder;
  const i = arr.indexOf(k), j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  this.prefEditOrder = arr.slice();
  // 重渲染保持顺序
  const prefs = App.state.prefs || {};
  const PREFS = { saving: ['存钱速度', '更快的年度目标推进'], lifestyle: ['生活质量', '保留生活体验与弹性'], security: ['财务安全感', '稳健与安全垫'], growth: ['资产增长', '财富长期增值'], investment: ['投资机会', '抓住投资窗口'] };
  $('#prefList2').innerHTML = arr.map((k, i) => `<div class="item" data-k="${k}">
    <span class="tag blue">${i + 1}</span>
    <div class="nm"><b>${PREFS[k][0]}</b><small>${PREFS[k][1]}</small></div>
    <div class="row" style="gap:4px;"><button class="btn sm ghost" onclick="App.prefEditMove('${k}',-1)">↑</button><button class="btn sm ghost" onclick="App.prefEditMove('${k}',1)">↓</button></div>
  </div>`).join('');
};

App.savePrefsEdit = async function () {
  const prefs = {};
  this.prefEditOrder.forEach((k, i) => { prefs[k] = i + 1; });
  prefs.ai_tone = 'direct';
  await DB.setMeta('prefs', prefs);
  App.state.prefs = prefs;
  toast('偏好已保存');
  App.go('settings');
};

/* 汇率 */
App.renderFx = function () {
  const html = `
    <h1 class="page">外币汇率</h1>
    <p class="sub">主源 Frankfurter（ECB 等 98 央行）· 每日缓存 · 历史冻结</p>
    <div class="card">
      <h3>手动更新汇率</h3>
      <button class="btn" onclick="App.fetchFxNow()">立即抓取最新汇率</button>
      <div id="fxResult" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>已缓存汇率</h3>
      <div id="fxList"></div>
    </div>
    <button class="btn ghost" onclick="App.go('settings')">返回</button>`;
  this.setView('fx', html);
  this.renderFxList();
};

App.fetchFxNow = async function () {
  const $r = $('#fxResult');
  $r.innerHTML = '<div class="anim-ico breath"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></div><div style="text-align:center;color:var(--text4);font-size:12px;">正在抓取…</div>';
  const f = await Svc.getFxRates(['HKD', 'USD', 'EUR', 'JPY', 'GBP']);
  const rows = Object.keys(f.rates).map(c => '<div class="item"><div class="nm"><b>' + c + '</b><small>' + (f.rates[c].source || '') + ' · ' + (f.rates[c].date || '') + (f.rates[c].stale ? ' · 缓存（非当日）' : '') + '</small></div><span class="amt">' + f.rates[c].rate + '</span></div>').join('');
  $r.innerHTML = f.fresh ? '<div class="notice" style="color:var(--green-l);border-color:rgba(0,194,107,.3);background:rgba(0,194,107,.08);">已抓取当日汇率</div>' + rows : '<div class="notice">接口不可用，已回退到上次缓存（如仍无缓存请手动填写）</div>' + rows;
  this.renderFxList();
};

App.renderFxList = async function () {
  const all = await DB.all('fxRates');
  const $l = $('#fxList');
  if (!$l) return;
  const grouped = {};
  all.forEach(r => { grouped[r.currency] = grouped[r.currency] || []; grouped[r.currency].push(r); });
  const html = Object.keys(grouped).map(c => {
    const list = grouped[c].sort((a, b) => a.rate_date < b.rate_date ? 1 : -1).slice(0, 5);
    return '<div style="margin-bottom:6px;"><b style="font-size:13px;">' + c + '</b> ' + list.map(r => '<span class="tag" style="margin-left:4px;">' + r.rate_date + ' ' + r.rate_to_cny + '</span>').join('') + '</div>';
  }).join('') || '<div class="empty">暂无缓存</div>';
  $l.innerHTML = html;
};
